# omapad - control the Omarchy/Hyprland desktop with a game controller.
#
# Copy this file to ~/.config/omapad/config.toml and edit it there; anything
# you leave out falls back to the values shipped here. Restart after editing:
#   systemctl --user restart omapad
#
# Action grammar for every binding:
#   click:left|right|middle|back|forward   mouse button (held, so drag works)
#   key:SUPER+RETURN                       virtual keyboard chord (held, repeats)
#   scroll:up|down|left|right              wheel, repeats while held
#   hypr:<lua dispatcher>                  Hyprland IPC, fired on press. This
#                                          Hyprland routes dispatch through Lua,
#                                          so it is written exactly as in
#                                          hyprland.lua, e.g.
#                                          hl.dsp.focus({ workspace = 'e+1' })
#   exec:<command>                         run a command, fired on press
#   osk:toggle|open|close                  the on-screen keyboard
#   osk:up|down|left|right|press           navigate and press it (directions repeat)
#   osk:shift|ctrl|alt                     latch a modifier for the next key
#   osk:caps                               toggle Caps Lock (and the labels)
#   osk:hold:shift|ctrl|alt                hold a modifier while the button is
#                                          down, the way a real one behaves
#   osk:submit                             Enter, then put the keyboard away
#   osk:layer:main|sym|fn|app              switch keyboard layer ('app' is
#                                          the page the focused app lends)
#   osk:layer:next|prev                    walk the keyboard's pages
#   menu:toggle|open|close                 the controller menu
#   menu:up|down|press|back                navigate and pick from it (up/down repeat)
#   quick:toggle|open|close                the quick menu - one row of tiles,
#                                          see [quick]
#   quick:left|right|up|down|press|back    walk the row, nudge a value, pick
#   guide:toggle|open|close               the bindings guide - what every
#                                          button does, badged like the buttons
#   guide:next|prev                        turn its pages
#   map:toggle|open|close                  the controller mapping screen -
#                                          teach omapad which button is which
#   map:skip|back|restart|save|cancel      drive it without the pad
#   mode:toggle|desktop|game               switch between desktop and game mode
#   lock:on|off|toggle                     the workspace lock: the pad is the app
#                                          in front's outright, and nothing of
#                                          ours fires but the menu chord
#   keep:on|off|toggle                     the same question the other way: the
#                                          pad is ours over an app that has
#                                          opened it and is not being played
#                                          with - a cloud client's launcher
#                                          screen reads no pad at all
#   pad:profile=auto|nintendo_pro|xbox     which codes this pad is read with
#   pad:layout=auto|nintendo|xbox|playstation
#                                          which console's names the badges print
#   pad:rumble=on|off|toggle               the motor
#   pad:rumble_strength=up|down|<0..1>     how hard it ticks
#   pad:pointer_speed=up|down|<200..4000>
#                                          how fast the pointer aims
#   pad:scroll_speed=up|down|<1..40>       how fast the wheel turns
#   pad:left_deadzone=up|down|<0..0.5>     how much of the left stick does
#                                          nothing
#   pad:right_deadzone=up|down|<0..0.5>    the same, for the right one
#
#                                          Every `pad:` value also takes
#                                          `next`/`prev` to step through what
#                                          the setting holds, so one button can
#                                          walk it. What is chosen is written to
#                                          ~/.config/omapad/settings.toml and
#                                          wins over this file until it is
#                                          deleted.
#   snap:left|right|up|down                put the pointer on the window that
#                                          way, and focus it
#   snap:centre                            put it in the middle of the window
#                                          in front
#   focus:next|prev                        walk the focused app's own controls
#                                          (Tab / Shift+Tab), see [traverse]
#   focus:up|down|left|right               the same, with the arrow keys
#   focus:activate|back                    press what is focused, or back out
#   term:interrupt                         Ctrl+C where the window in front is
#                                          running a command, and the window's
#                                          close where it is not - see
#                                          [terminal]
#   nop                                    disable an inherited binding
#
# A binding can also be a table to separate a tap from a press-and-hold:
#   PLUS = { tap = "exec:omarchy-menu toggle", hold = "exec:omarchy-menu toggle apps" }
#
# The same table says what a binding means, for the guide (`guide:open`), which
# otherwise reads the action itself - fine for `key:ENTER`, thin for a Lua
# dispatcher:
#   L = { tap = "hypr:hl.dsp.focus({ workspace = 'r-1' })", desc = "Previous workspace" }
#   HOME = { tap = "...", hold = "...", desc = "Next window", hold_desc = "Game mode" }
#
# `on_press = true` fires the tap on the way down, where it would otherwise
# wait for the release. Two things make a button wait: a chord naming it
# (whether it is half of one is only known once the partner has had a chance
# to land) and a hold on it (whether it is a tap is only known once it comes
# up). A tap that only answers when the thumb comes off looks like a press
# that did nothing, and held a moment longer to make sure it becomes the hold
# instead. With this the tap acts at once. A partner landing while the button
# is still down turns it into the chord, which takes over; and a hold still
# fires when it is due - where the tap was a `toggle`, it is pressed again
# first, so holding HOME to switch mode does not leave its menu open behind:
#   PLUS = { tap = "quick:toggle", on_press = true }
#   HOME = { tap = "menu:toggle", hold = "mode:toggle", on_press = true }
#
# `reaches_past` decides whether a binding still fires while the pad has been
# handed to the app in front. Say nothing and a summon gets through and nothing
# else; `true` lets anything through (a click over a cloud session, which no
# announced hold can be), `false` keeps even a summon back (PLUS and MINUS ship
# that way - Back and Start are buttons every game binds). It can also be said
# once for a whole layer under [layers.*], and a row inside can still opt out:
#   ZR = { tap = "click:left", reaches_past = true }

[device]
# Which pad to drive. "auto" takes whichever pad is connected: a node counts as
# a pad because of what it advertises - absolute axes and buttons in the
# joystick range - not because of its name, so a pad nobody has heard of needs
# nothing written here, and the keyboard and mouse nodes a wireless Xbox pad
# also enumerates are never mistaken for it.
#
# Name one when you have more than one pad plugged in and care which wins, or a
# list of them tried in the order written. Each is either "VVVV:PPPP" (as evdev
# reports it) or part of the device name. A name fragment is the sturdier
# choice for pads with a hardware mode switch: the Beitong KP20/KP40 enumerates
# as "BEITONG BTP-KP20 NS" (057E:2009) in NS mode and as
# "Beitong KP20A/KP40A Controller" (20BC:5127) in XInput mode, and "BEITONG"
# matches both.
#
#   match = ["Xbox", "BEITONG"]
match = "auto"

# auto reads the profile off the connected device, so switching the pad between
# NS and XInput mode needs no config change. Force it with nintendo_pro | xbox.
profile = "auto"

# Which console's printing the badges carry: nintendo | xbox | playstation, or
# auto to follow the profile. The profile says what a button *is* - which code
# is the one under your right thumb - and this says what it is *called*, which
# is a different question: the same button is A on an Xbox pad, B on a Switch
# one and the circle on a PlayStation one.
#
#   nintendo     A B X Y   L R ZL ZR    − +   Home  Capture
#   xbox         A B X Y   LB RB LT RT  View Menu   Guide  Share
#   playstation  ✕ ○ □ △   L1 R1 L2 R2  Create Options  PS  Mute
#
# Every one of those is drawn rather than typed - see assets/README.md.
#
# Worth setting by hand for a PlayStation pad: it reports itself as an XInput
# device, so auto lands on xbox and prints letters on a pad that has shapes on
# it. Worth leaving alone otherwise - a layout that names a pad you are not
# holding puts the face symbols in the wrong corners.
layout = "auto"

# XInput pads report ZL/ZR as analog axes rather than buttons. These are the
# press and release points, as a fraction of full travel; the gap between them
# is hysteresis that stops a half-held trigger from chattering.
trigger_threshold = 0.45
trigger_release = 0.30

# And where the trigger *rests*, as a fraction of that travel. A pad's
# advertised minimum is a claim rather than a measurement, and plenty of them
# rest well above it - a Beitong KP40A in XInput mode sits a fifth of the way
# in and never comes back down. That reads as a pull nobody is making, and the
# menu's sweep is a rate: the tile under the cursor crosses its range on its
# own, which is a volume that climbs while the pad is on the table.
#
# Everything at or below this is no pull at all, and what is left is spread
# over the rest of the travel, so a trigger still sweeps from nothing to full
# speed rather than starting partway up. It sits just under `trigger_release`:
# the sweep stops a hair before the button sense calls the trigger let go.
#
# Raise it if a control still drifts with nobody holding the pad; lower it
# towards 0 - on a pad that truly rests at its minimum - to have the sweep
# answer the lightest touch. A trigger at rest sends no event, so `dump` never
# sees one: `omapad check` is what prints where yours is sitting.
trigger_rest = 0.25

# ---------------------------------------------------------------------------
# The keyboard on the desk.
#
# Every surface omapad draws is put up over everything else, and most are
# driven by the pad - which makes them a trap the moment the pad is not what
# is in your hand: a keyboard summoned from an Omarchy keybind, a menu still
# up when the battery went, a guide opened from a terminal. So while - and
# only while - one of them is on screen, the keyboard can send it away too.
#
# The menu is the exception: it takes the keyboard and the mouse itself while
# it is open (the same Exclusive focus the Omarchy menu uses), so the arrows,
# Enter and Escape reach it without anything bound here. The tables below are
# for the surfaces that stay pad-only, and for getting out of them.
#
# The nodes are opened when a surface opens and closed again when the last one
# goes; nothing here reads the keyboard the rest of the time.
# ---------------------------------------------------------------------------

[keyboard]
enabled = true
# Which keyboards count. "auto" is every one the machine has; narrow it the way
# [device] match does - "VVVV:PPPP" or part of the device name - if only one
# should. Name fragments in `ignore` are skipped: for a node that says keyboard
# and is not one (a receiver that also carries media keys, a KVM). omapad's
# own virtual keyboard is always skipped, whatever is written here.
match = "auto"
ignore = []
# Take the keyboard exclusively while a surface is up, so a key that closes a
# panel does not also reach the game behind it. Off by default: with it on
# nothing can be typed into anything - what the on-screen keyboard is for
# included - until the panel goes away. It does not reach the menu either:
# with `grab` on, bind keys in [keyboard.bindings.menu] below and they drive
# it, since the menu surface no longer sees a grabbed key.
grab = false

# key = action, in the same grammar the pad's bindings use, and resolved the
# same way: the table named after whatever surface is on top, then base. Three
# actions exist for a key that cannot know what is up -
#   surface:close        send away whatever is on top
#   surface:close_all    all of them
#   surface:back         up one level where there is one, out where there isn't
# but anything a button can do can be written here as well.
[keyboard.bindings.base]
esc = "surface:close"

# The menu walks by itself - no arrows to bind here unless `grab` above has
# taken the keyboard away from the surface. Then this table is the only way in:
# [keyboard.bindings.menu]
# up = "menu:up"
# down = "menu:down"
# enter = "menu:press"
# left = "menu:back"
# right = "menu:press"

[mode]
# Which mode the daemon comes up in, which is to say the mode the machine is in
# when it finishes booting. desktop = the ordinary desktop. game = the same
# thing from the couch: the bar replaces Omarchy's, and every binding still
# works. Game mode is not a hand-off - handing the pad to a game is automatic,
# and separate.
#
# The menu has it too, under System > Start in, because this is the one
# question about the couch that could only be answered at a keyboard: a machine
# used from a sofa has to be told to come up ready for one. What is picked
# there is written to settings.toml, which wins over this line.
start = "desktop"
grab = true                   # take the pad exclusively, so nothing else acts
                              # on the buttons omapad is already acting on
# A grab taken while a button is down strands that button in whatever had the
# pad: the kernel gives the events to whoever holds the grab, so the release
# never arrives and the app goes on believing the button is held. Steam skips
# every Guide press it reads as a chord, and a bumper it thinks is down makes
# one of all of them - so the shoulder held to walk a workspace out of Steam
# costs the Steam menu for the rest of the evening. So a grab waits for the pad
# to be let go, and this is how many seconds it waits before taking it anyway.
# The wait is bounded for the button that is never released - a dongle that
# dropped mid-press - and while it lasts the app sees our presses too. 0 takes
# the pad the moment it is wanted, which is where this used to be.
grab_settle = 2.0
notify = true                 # desktop notification on every mode switch
# A tick on the motor at every mode switch too. The switch is the one press
# whose result you may not be looking at - the pad is on your lap, the bar is
# swapping itself out across the room - so it is worth feeling. One tick each
# way; turn it off if the notification above is answer enough.
rumble = true
# There is no list of games worth keeping, so the question is asked of the
# program instead: a gamepad is a file, anything that wants to read one has to
# open it, and /proc says who has. When the window in front - or its process
# tree - has the pad open, omapad lets go; when it stops, omapad takes it
# back. A terminal never opens it. A browser opens it the moment a page asks
# for a gamepad, which is exactly when a cloud session wants it.
#
# The menu, the keyboard and the guide can still be summoned while an app has
# the pad, and opening one takes it back for as long as it is up - otherwise
# the D-pad would drive the menu and the game at once.
#
# The sticks stop dead there, and they get no way back: a press is over when
# the thumb comes off, but a stick left over slides the pointer across the game
# for as long as it is held, and an app reading a pointer has stopped reading
# the pad.
#
# Seconds between checks. Focus changes ask anyway; this catches the app that
# opens the pad a moment after its window appears, which is most of them.
handover_poll = 2.0
# How far *down* from the focused window's process to look, and how far up
# when there is no cgroup to bound the climb (see below). Raising it walks
# towards the session leader, and everything under that is every window on the
# desktop, so raise it only on a machine that gives applications no scope of
# their own.
handover_depth = 3
# Whether the cgroup is trusted as the edge of an application. It is what
# makes two things work, and both are Proton's.
#
# Sideways: the process that opens the pad under Proton is `winedevice.exe`,
# wine's HID service, a sibling of the game rather than part of its line. With
# this off, a Proton game leaves the pad driving the desktop's pointer over the
# top of it.
#
# Upwards: the launchers between Steam and a game it starts are deeper than any
# count - `steam -> srt-bwrap -> pv-adverb -> steamwebhelper` is three before
# the game's own wrapper - so with this off the pad is handed over for Steam's
# own window and not for the game, which is the same fault wearing a different
# hat. systemd gives a launched application its own scope and everything Steam
# starts stays inside it, so the climb ends where the application does.
#
# Turn it off only on a machine that puts unrelated windows in one cgroup;
# there the boundary would mean nothing and `handover_depth` is the only bound.
handover_siblings = true
# Omarchy's bar is a desktop object: every widget on it opens a popup you
# click, and from the couch there is no pointer worth clicking with. So game
# mode parks it off-screen (`omarchy toggle bar`, no shell restart) and
# omapad's own bar takes its place - see [gamebar]. It is put back on the way
# out, and at shutdown too, so a daemon that dies there does not leave you
# without one. On a machine with no Omarchy the whole thing is skipped
# quietly. Turn it off to keep the desktop bar in game mode; both reserve
# their own strip, so you get the one you cannot reach above the one you can.
hide_bar_in_game = true
# In game mode the screen belongs to the couch, and the screensaver firing
# mid-game reads as a black screen over it. So game mode also tells Omarchy to
# stay awake (`omarchy toggle idle stay-awake`) - the screensaver and the lock
# cannot come on while it is up - and puts idle back on the way out and at
# shutdown, exactly as it does with the bar. Turn it off if you would rather
# game mode left the desktop's idle behaviour alone.
stay_awake_in_game = true
# What the sticks do in game mode. Empty means "the same as on the desktop",
# which is the answer for the left one: the pointer is the pointer wherever you
# are sitting.
#
# The right one is not. On the desktop it is the wheel; from the couch, walking
# the focused app's own controls is worth more than scrolling - and it does the
# scrolling anyway, because focus scrolls into view. See [traverse].
#
# This is the one thing game mode changes about a stick, and it costs no
# button. Set it to "scroll" to have the wheel back everywhere, or give one app
# the wheel and leave the rest walking their controls with
# `right_stick` in a [profile.<name>] - which is what the browser does, because
# it scrolls the focused element rather than the one under the pointer.
left_stick = ""
right_stick = "focus"

[pointer]
speed = 1100.0                # pixels per second at full stick deflection
accel = 2.2                   # response curve; 1.0 linear, higher = finer control near center
# How much of each stick's travel does nothing, as a fraction of it. The
# question is asked of the stick rather than of what the stick is doing,
# because the slop is in the hardware: the right one carries the same zone
# whether it is scrolling the desktop or walking a game's controls in game
# mode.
#
# Widen one when an untouched stick still creeps the pointer along - a worn pad
# rests a percent or two off centre - and narrow it when small corrections are
# swallowed and aiming feels like it starts late. Controller > Sticks moves
# both from the pad, with the pointer live under the open menu, which is the
# only way to tell those two apart.
#
# The right one ships wider because it ships scrolling, where a page sliding
# away under a thumb that never asked costs more than a notch that arrives
# late. Hand it the aiming role below and it is worth bringing down to the
# left one's.
#
# These were one number per *role* before - `deadzone` here and under [scroll] -
# and a config that still sets those is read, each for the stick that ships in
# its role.
left_deadzone = 0.10
right_deadzone = 0.18
# Bear the pad that lies about its sticks. A Beitong KP20 in NS mode rests
# every axis half a range off the centre it advertises and then uses only that
# half (X spans -32767..0, Y spans 0..32767), so an untouched stick reads as a
# half deflection and walks the cursor into a corner. recenter calibrates each
# axis on the value it actually rests at when the pad connects, and takes the
# nearer advertised end as the half-range, so rest reads 0 and both ends still
# reach full speed. A pad that rests where it says it does is unaffected.
recenter = true
recenter_limit = 0.60         # a rest farther than this from centre is a stick
                              # someone is holding at connect; leave it alone.
                              # It is also how much travel is left over, from
                              # the other side: calibrating on a rest this far
                              # out leaves only 1 - 0.60 of the range to reach
                              # full deflection in, and everything past that -
                              # the stick's true centre included - pins to the
                              # end. A pad that really does rest off centre
                              # rests at 0.50 (the KP20 above), so raising this
                              # towards 1.0 mostly buys stuck sticks; lower it
                              # if a pad still calibrates onto a held thumb.
# Console-shaped scheme (item 07): the left trigger is right-click now, and the
# precision slowdown was removed with it. Set a button here to bring it back.
precision_button = ""
precision_factor = 0.28
poll_hz = 125
# Put the pointer away when a press is not aiming it, and leave it away until
# something points again. A console shows no pointer between one thing you
# point at and the next; a desktop leaves the ring sitting over whatever the
# press just opened, where from across a room it reads as one more thing still
# waiting to be dealt with.
#
# The desktop already does this for the keyboard: Hyprland takes the pointer
# off screen at a keystroke and brings it back at the next movement of a mouse
# (cursor:hide_on_key_press, which Omarchy ships on). A pad is a keyboard that
# does not type, so a press says as much itself, and the stick brings the
# pointer back by moving it - as does a mouse on the desk, since the hiding is
# the compositor's and not ours. Clicking and scrolling never hide it: those
# are the pointer at work.
#
# Turn it off to keep the ring on screen whatever is pressed. With
# cursor:hide_on_key_press turned off in Hyprland, this does nothing either
# way, and omapad says so once at startup.
hide_on_press = true
# Both roles are off while the app in front has the pad, whatever is set here:
# see [mode] handover_depth.
left_stick = "cursor"         # cursor | scroll | snap | focus | swap | none
# "snap" turns a stick into a flick: push it over and the pointer jumps to the
# window that way instead of walking there. See [snap].
# "focus" stops aiming altogether: the stick walks the focused app's own
# controls, Tab by Tab, and repeats while it is held. See [traverse].
# "swap" is a flick too, and moves the window rather than the pointer: the
# focused window changes places with the one that way. See [swap].
right_stick = "scroll"

[rumble]
# A tick under the thumb when a binding marked `rumble = true` fires, so a
# workspace switch is felt as well as seen - the pad's own answer to a press,
# which matters most when the change happens off screen. Bindings that only
# move a cursor or type a character never buzz; nothing is worth feeling if
# everything is.
#
# The defaults were picked by feel on a Beitong KP20 in NS mode, which wires
# only the low-frequency motor: its high-frequency one is silent at any
# magnitude. Pads that wire both usually give a crisper tick on `weak`.
enabled = true
strong = 0.20                 # 0..1 on the low-frequency motor - this is the tick
weak = 0.0                    # 0..1 on the high-frequency motor, where there is one
duration_ms = 60              # short enough to read as a click, not a buzz

# The floor under every pulse above and below. A pulse shorter than the packet
# interval of the slowest driver omapad supports can fall between two packets
# and never reach the motor - hid-nintendo sends rumble every 50ms - so this is
# the shortest thing worth asking for rather than a claim about any one pad.
floor_ms = 50

# The motor says four things, not one, and which waveform says which is not a
# setting: a square wave is what makes an edge feel like an edge, and making
# that configurable is offering to turn a bump into a hum. How hard and how
# long are settings, because those are taste.
#
#   tick     a press landed              - the three lines above
#   edge     you cannot go further       - a control at its end, the grid's rim
#   commit   that took                   - a switch flipped, a tile put down
#   texture  how far you have taken it   - held while a value is being pushed
#
# A pad with no periodic effects plays `edge` and `commit` as plain ticks.
edge_strength = 0.35
edge_duration_ms = 70
commit_strength = 0.28
commit_duration_ms = 90

# **The texture is the one word with two motors to say something with.** A pad
# wires its low-frequency motor on the left and its high-frequency one on the
# right, so the hand that made the move is the hand that feels it: a value
# pushed right buzzes on the right and pushed left on the left. A range is the
# only thing it answers - walking a list up and down has one motor for both
# ways, which is a buzz saying something moved without saying which, and that
# is the scheme this effect was kept switched off for.
#
# **One level, not a scale.** It rose with the distance from where a push
# started for a pass, which is a second reading of the number the tile is
# already printing; what a hand pushing a control is asking is whether the
# push landed. So this is how hard, flat, for as long as the control is
# moving - an absolute level like `edge_strength` and `commit_strength`
# above, rather than a share of the tick.
#
# It shipped off, when it was one hum whichever way you pushed: a scheme where
# everything buzzes says nothing. Something that says *which way* is not that,
# so it ships on.
texture = true
texture_strength = 0.25

[scroll]
speed = 8.0                   # wheel notches per second at full deflection
# Two different things get called acceleration, and both are here. This one is
# the response curve - how far the stick is over, into how fast it goes. 1.0
# is linear; higher gives finer control near the centre.
accel = 2.0
# And this one is time: a page is long and a thumb is not, so a stick held one
# way keeps getting faster, up to `ramp` times the speed above, reached after
# `ramp_ms` of holding. Letting go hands it back, and so does reversing - a
# reversal is somebody who has gone too far, and the speed they overshot at is
# the last thing they want. 1.0 is off, which is what a mouse wheel does.
ramp = 3.0
ramp_ms = 900
natural = false               # true inverts the direction

[cursor]
# The pointer game mode draws. An arrow eleven pixels wide is unfindable from
# a sofa, and nothing installed here is a large round one, so omapad draws
# its own: a ring with a dot in the middle, written once into
# ~/.local/share/icons and applied with Hyprland's setcursor. The desktop's
# own pointer comes back when game mode ends, and at shutdown too, so a daemon
# that dies in game mode does not leave you with it.
#
# Every cursor shape in the theme is the same ring on purpose. From the couch
# an I-beam over a text field is the same smudge as an arrow, and one shape
# that never changes is easier to follow than a correct one that does.
enabled = true
apply = "game"                # game = only from the couch. "always" wears it
                              # whenever the daemon is running, for anyone who
                              # drives the desktop with the pad all day.
size = 48                     # nominal pixels. 32 is an ordinary large pointer,
                              # 96 a target
theme = "omapad-ring"         # the name it is written and applied under. A
                              # directory name, not a path: omapad writes into
                              # ~/.local/share/icons/<theme> and prunes it
# The colours. `auto` reads the desktop's own theme - Omarchy keeps it in
# ~/.local/state/omarchy/current/theme/colors.toml - so the pointer changes
# with everything else on screen instead of being the one white thing on a
# themed desktop: `color` takes its foreground, `outline` its background.
#
# Any other name is a key read out of that same file, so `color = "accent"` is
# a pointer in the theme's accent; a `#rrggbb` or `#rrggbbaa` is used as it is,
# and anything the theme cannot answer falls back to white on black.
color = "auto"
outline = "auto"              # the halo under the ring, so a pale pointer
                              # stays visible on a pale window
# The ring's proportions, as fractions of the size rather than pixel counts, so
# it looks like itself at 24px and at 128px alike.
thickness = 0.085             # how thick the ring's band is
dot = 0.05                    # the dot in the middle; 0 leaves it off
halo = 0.045                  # how far the outline reaches past the ring;
                              # 0 leaves it off, which is worth it only on a
                              # wallpaper you already know the colour of
ring_opacity = 0.75           # how solid the ring's band is, 0..1. The dot in
                              # the middle is always solid - it is where the
                              # click lands; the ring only has to be findable,
                              # and a little under full reads as a target
                              # around the pointer rather than a hoop over
                              # whatever is beneath it
# all     every cursor shape is the ring - the I-beam, the resize arrows, all
#         of them. This is the couch answer.
# pointer only the plain arrow is replaced, and every other shape comes from
#         the desktop's own theme (written into Inherits=).
shapes = "all"
# What to put back afterwards. Empty asks the desktop at the moment of the
# swap - gsettings, which this Hyprland follows, then XCURSOR_THEME - so a
# theme changed while omapad runs is still the one restored.
restore_theme = ""
restore_size = 0

[control]
# The socket `omapad ctl` talks to, and the shell plugin with it. Nothing on it
# is authenticated: it takes every command a binding can run, so the default
# lives in $XDG_RUNTIME_DIR, which is yours alone and 0700. A path written here
# is taken as asked for - omapad only says so in the log if the directory it
# names is one other users can write to.
# socket = "/run/user/1000/omapad/control.sock"  # defaults to $XDG_RUNTIME_DIR

[ripple]
# What a click looks like. A mouse answers a click three ways - the finger
# feels the switch, the hand is on the thing that moved, the arrow sits on
# what was hit - and a pad answers none of them: the thumb is on a trigger
# that feels the same whatever it did, and the pointer is a ring that looks
# identical before and after. So every click the pad makes leaves a burst
# behind at the pointer, with the half of it on the side of the button that
# was pressed drawn solid, so left and right differ by more than a colour.
#
# It is drawn in the theme's own colours like every other surface: the accent
# for the left button, the menu's foreground for the right.
enabled = true
size = 0                      # the burst's diameter in logical pixels. 0 is
                              # twice [cursor] size, so it reads as leaving
                              # the ring rather than happening beside it
duration_ms = 260             # how long one burst lasts. Much longer and a
                              # double click draws over itself
thickness = 0.09              # the ring's band, as a fraction of the size the
                              # way [cursor] thickness is
# socket = ""                 # default: $XDG_RUNTIME_DIR/omapad/ripple.sock

[sound]
# What a press sounds like. The pad already answers a press two ways and both
# have a hole in them: the screen is answered by looking at it, which is the
# one thing somebody walking a menu by thumb is not always doing, and the
# motor is in the hands - so it says nothing at all while the pad is resting
# on a knee, and nothing ever on a pad that has no motor. This is the third
# way, and it is the one a room hears.
#
# **It ships off, and that is deliberate.** Every other answer this program
# gives is to the person holding the pad; this one is to everybody else in
# the room as well, so it is switched on by whoever decides that - one press
# on Now > Sounds, or this line. Rumble ships on for exactly the opposite
# reason.
enabled = false
# How loud, against the files' own level. They are mastered quiet on purpose -
# a cue is mixed over whatever is already playing - so 1.0 is not loud, and
# this is here to put them under a film rather than over one.
volume = 0.6
# Where the five files come from: `move.wav`, `back.wav`, `tick.wav`,
# `edge.wav` and `commit.wav` in a directory of your own. Empty is the set that ships,
# written by `assets/sounds.py` - synthesised rather than recorded, so a
# different commit is a different number in that file. A directory missing a
# name loses that one cue and keeps the rest, which is what makes a pack of
# one sound worth writing.
pack = ""
# socket = ""                 # default: $XDG_RUNTIME_DIR/omapad/sound.sock

[idle]
# How long omapad keeps the screen awake after the pad was last touched.
#
# It is holding it awake at all because **pad input is invisible to the
# compositor**: walking a menu with a thumb moves a selection over a socket
# and produces no Wayland input, so as far as the session is concerned nobody
# is there. The keyboard, the guide, the mapping screen and the game bar each
# bind an idle inhibitor while they are up, and game mode asks the desktop for
# `stay-awake` outright (`[mode] stay_awake_in_game`).
#
# What that leaves is a hold with nothing at the other end of it: a menu left
# open on a television holds the screensaver off all night, and an OLED pays
# for it. So the hold follows the thumb rather than the surface - a press, a
# D-pad step, a stick pushed past its dead zone - and lets go this long after
# the last one. The desktop's own screensaver and lock decide what happens
# then, which is what they are for; the next press takes the hold back.
#
# Five minutes because that is about what a screensaver waits anyway, so the
# two waits do not stack into a wait nobody recognises. **0 never lets go**,
# which is what this did before it was a setting.
awake_ms = 300000
# socket: none of its own - `awake` rides on every surface's payload, because
# what it decides is true of all of them at once.

[snap]
# Stop aiming. `snap:left|right|up|down` puts the pointer on the window that
# way and focuses it, which is the console answer to the one thing a thumbstick
# is worse at than a mouse.
#
# Windows, not buttons: the accessibility bus is the only thing that knows
# where a button is, it reports every widget at screen 0,0 under Wayland, and
# browsers, games and terminals do not join it at all. Hyprland knows exactly
# where every window is, so that is the layer this can be right about; aiming
# inside a window stays the stick's job.
focus = true                  # focus what it lands on, not just point at it
same_monitor = true           # false lets a flick cross to the next screen
# What a window off to the side costs against one straight ahead, both measured
# edge to edge. Below 1 the nearest window wins whatever direction was pressed,
# which makes the press meaningless; far above it only a window perfectly in
# line is ever reachable. It decides between the windows that way, never
# whether one is: nothing overlapping the window you are in is ever the
# answer, at any number here.
bias = 2.0
# A tick under the thumb when a snap lands, and only when it lands: a flick
# into an empty edge that buzzed would say the same thing as one that worked.
# A `snap:` binding on a button can already ask for this with `rumble = true`;
# this is the switch for the stick, which carries a role rather than a binding.
# Off by default, and there is no equivalent for [traverse]: a step that
# repeats while it is held would buzz all the way down a list.
rumble = false
# For a stick whose role is "snap": how far it has to go over to count as a
# flick, and how far back it has to come before the next one. The same
# hysteresis the analog triggers use, for the same reason - a stick held over
# is one press, not a stream of them.
flick = 0.75
release = 0.45

[swap]
# A stick whose role is "swap" rearranges the tiles: push it over and the
# focused window changes places with the one that way. It is also the tiled
# half of the "move" role - see [layers.window] below for why that role has
# two halves.
#
# The same hysteresis as [snap] on firmer numbers. A snap that overshoots put
# the pointer on the wrong window and the next flick brings it back; a swap
# that overshoots has rearranged the screen, and the way back is another swap
# past a window that is no longer where it was. Lower `flick` towards [snap]'s
# 0.75 if a deliberate push is being missed; raise `release` if one push keeps
# firing twice on the way back.
flick = 0.85
release = 0.45

[traverse]
# Stop aiming, part two: let the app do the geometry.
#
# `snap` gets the pointer onto the right window; inside that window nothing
# outside the app knows where its buttons are. The accessibility bus is the
# only thing that could say, and under Wayland it reports every widget at
# screen 0,0 - and browsers, games and terminals do not join it at all. But
# every toolkit already answers Tab and the arrows, and answers them
# correctly, because it is the thing that knows. So omapad asks instead of
# aiming: `focus:next` sends Tab and the app moves its own focus ring.
#
# Which key each step sends is written here rather than in the code because
# the answer is not the same everywhere - a list wants the arrows, a form
# wants Tab - and an app that disagrees can be given a profile of its own.
# An empty string turns a step off.
next = "TAB"
prev = "SHIFT+TAB"
up = "UP"
down = "DOWN"
left = "LEFT"
right = "RIGHT"
# Space rather than Enter: Space presses the focused button and ticks the
# focused checkbox in GTK, Qt and every browser, where Enter fires the form's
# default action - which is not always the thing under the focus ring.
activate = "SPACE"
back = "ESC"
# For a stick whose role is "focus". It steps once when it goes over, waits
# out the delay, then walks at the rate - the way a held key behaves. The
# repeat is omapad's rather than the compositor's: a stick pushed over is
# not a key held down, and an app that saw one would autorepeat straight past
# wherever the thumb stopped.
repeat_delay_ms = 350
repeat_rate_ms = 90
# How much faster a held direction walks, once it has been held for
# `repeat_ramp_ms`. This one is every stick walk on the pad - a window's own
# controls, and the menu's grid, which takes its rate from here - because a
# stick pushed over and left there is the clearest case of somebody crossing a
# distance rather than stepping once. 1.0 turns it off.
repeat_ramp = 2.5
repeat_ramp_ms = 1000
flick = 0.65                  # lower than [snap]'s: this one is a direction
release = 0.35                # held, not a shove

# Which step each way of that stick means. The Tab order across and the arrows
# up and down suits a form or a page; a list is often the other way round, so
# it is named here rather than assumed. Any of the eight steps above, or an
# empty string to turn a direction off.
[traverse.stick]
left = "prev"
right = "next"
up = "up"
down = "down"

# Chromium has a spatial navigation mode that makes the arrow keys jump to the
# nearest control instead of scrolling, which is what `focus:up|down|left|right`
# wants from a web page. It is off by default:
#   chromium --enable-features=SpatialNavigation
# or the Spatial Navigation entry in chrome://flags.

[ui]
# How big omapad's own surfaces draw - the keyboard, the menu, the guide, the
# mapping screen and the game-mode bar. It multiplies the
# shell's own spacing and type scale rather than replacing it, so a theme that
# already runs roomy stays roomy here; 1.0 is exactly what Omarchy draws.
#
# Two values, because the same desktop is read from two distances. On the
# desktop the surfaces sit beside Omarchy's own menus and should measure like
# them; in game mode the screen is across a room, and the size that reads at a
# keyboard is the size nobody can read from a sofa. Only the surfaces move -
# the desktop itself, and anything the shell draws, is Omarchy's business.
#
# The switch is live: change modes with a surface up and it is redrawn at the
# other scale.
#
# **Game mode is 1.0, and that is not a mistake.** The menu is built to a
# design drawn for a 1920 screen watched from a sofa, and its numbers are
# already couch-sized: a 128-pixel tile, a 45-pixel title, sixteen pixels of
# air. Multiplying those by a couch factor is counting the room twice - the
# page comes to more than the screen holds, the module has to be shrunk by
# hand to fit, and then the type and the padding are the only things still
# scaled, so a nav card's label elides inside a card that should have room
# for it twice over.
#
# Raise it and every measurement on every surface grows together, which is
# what it is for and what it still does. It is `[menu] cell` and `columns`
# that have to come down with it, or the page scrolls sideways.
scale = 1.0
game_scale = 1.0
# How a badge is drawn, which is a different question from what it prints:
#   filled   the shape washed in the surface's own colour with the label set
#            solid on top. A badge that sits quietly in a list of them.
#   stencil  the shape solid in the theme's accent with the label punched
#            through it, so whatever is behind the badge shows through the
#            letter. It reads from further away and turns a row of badges into
#            the loudest thing on the screen - which is what game mode wants
#            and can be more than a desk does.
# The two also press differently on the game bar. A filled badge brightens
# under the thumb; a stencil one inverts - the fill drains out and the letter
# fills in - because a shape that is already solid has nowhere brighter to go.
badge_style = "filled"
# How hard the surfaces round a corner, against **the desktop's own answer**.
#
# The base is never ours: `decoration:rounding` is what this machine rounds
# every window by, and a surface of ours that picked its own number would be
# the one thing on screen not answering to it. Where the compositor rounds
# nothing it is saying that about *windows*, and a tile is not a window - so
# `[menu] tile_corner` is the base there, and this multiplies whichever of the
# two is in force.
#
# 1.0 is exactly what the desktop rounds and **0 is square.** It is also the
# one setting here that is set by looking at the thing it sets: it is on the
# pad as `Display > Corners`, and the tiles under the slider round as it
# moves.
#
# **It steps by a rung, not by tenths.** Every size on these surfaces climbs
# by sqrt(2) - the type, the gaps, the corners off them - which is the silver
# ratio less one. A corner is a size like any of them: 23 pixels against 25 is
# not a difference anybody sees from a sofa, and 23 against 32 is. So the
# stops are 0, 0.5, 0.707, 1 and 1.414 - `Square`, `Barely`, `Slight`, `The
# desktop's`, `Round` - and the ladder ends one rung above the desktop's own
# answer, because two rungs past it a 128-pixel tile is a circle, which is a
# different shape rather than a rounder corner. Wanting bigger corners than
# that is a question about the *base*, and the base is `[menu] tile_corner`.
radius = 1.0
# How long the surfaces take to move: a multiplier over every animation on
# them, and the whole of what they animate is a fade, a scroll catching up
# with a selection, and a badge filling. None of it is decoration - the fade
# is what says a tile went away rather than was never there - so this dims
# the effect rather than picking which ones survive.
#
# 0 turns motion off: every animation lands on its last frame at once, which
# is what a person who reads a moving screen badly is asking for. 1 is what
# the surfaces were drawn to, and it is the top of the range rather than the
# middle of it - this is a way of asking for *less*, and a screen that took
# longer than it was drawn to take is the lag every one of these durations
# was kept under 150 ms to avoid.
#
# From the pad it is five places rather than a range - `Off`, `Little`,
# `Half`, `Most`, `Full` - drawn as five segments, because a quarter is the
# smallest change anybody can see in a screen moving and `Off` is a word this
# setting exists to be able to say. A number in between is yours to write
# here and is kept.
motion = 1.0
# And whether the desktop gets to say it first. Hyprland's own
# `animations:enabled` is this machine's answer to the same question, asked
# about every window on screen - so a desktop that has turned animations off
# has already said what it wants, and a program that kept sliding its own
# panels about would be the one thing on the screen not listening.
#
# It is a **veto rather than a scale**: the desktop can only take motion away,
# never add it, so `motion = 0` stays 0 on a desktop that animates. Turned
# off, the number above is the whole answer - which is what somebody who
# wants the surfaces still on an animated desktop, or moving on a still one,
# is asking for.
#
# Asked on the beat the theme is checked on, so turning Hyprland's animations
# off reaches an open menu within a couple of seconds rather than at the next
# restart.
motion_follows_desktop = true
# How much of the screen's edge the surfaces keep clear of anything that has
# to be read, as a share of each side. A television is the one screen that
# does not show what it is sent: the outer few percent are behind the bezel or
# cropped by the set itself, and a row of hints along the bottom edge is the
# part it eats first. Broadcast has kept 5% for this since it was the only way
# to be sure, and the consoles still do - so **0.05 is the number to write
# here if this desktop is on a set.**
#
# **It ships at 0, and game mode is why.** This was 5% and applied whenever
# game mode was on, on the argument that game mode is when a television is
# being used. It is not: game mode is the couch environment, and a couch is as
# often a desk monitor turned up loud. A monitor shows every pixel it is sent,
# so the bar came off the bottom edge and off both ends and sat in the middle
# of nothing - a strip floating a centimetre from three edges that were never
# cropping anything. A guess that costs 5% of every edge is worse than no
# guess, because the person on a set knows they are on one and can say so
# here, and the person on a monitor has no way of knowing what took their
# margins away.
#
# **Only in game mode** either way: it is the only time this program has any
# reason to assume a television at all.
#
# **A floor, not an addition.** A surface with a bigger margin of its own
# keeps it - the fullscreen menu's 45 down and 91 across already clear 0.04 on
# a 1080 screen - and one with a smaller one is held off to here. So raising
# it moves only what was nearer the edge than this.
#
# **What comes in is what has to be read, not the ground under it.** The game
# bar still reaches its edge and still fills the screen's width: a bar that
# stopped short of the corners would be saying something about the shape of
# the screen rather than about what a set crops. It is the row of hints inside
# it that comes in.
safe_area = 0.0

[osk]
# On-screen keyboard. The layout and the selection live in omapad; the
# Omarchy shell plugin `canerakdas.omapad` only draws them, so a key is
# typed the moment it is pressed rather than after a round trip to the shell.
# grid    a console keyboard: the whole thing on the first page, keys sized the
#         way a real keyboard sizes them (a letter is one unit, Tab and Enter
#         and the shifts are wider) inside a width budget every row shares.
# classic  a physical desktop keyboard, full size, two pages.
layout = "grid"

# Print what the keys will actually type. omapad sends keycodes, so the
# character depends on the compositor's XKB layout; with this on, the labels are
# read back out of that same layout instead of assuming US QWERTY.
labels_follow_layout = true

# Print the controller button beside the key it reaches. The keyboard's own
# layer binds buttons to things the keyboard also has keys for - Backspace,
# Space, Shift, the page turn - and a small badge on the key itself is what
# says so, matched on what a binding does rather than on which button carries
# it, so a rebound scheme badges itself.
badges = true

# Where on the key that badge sits.
# right  against the key's own right edge, so the badges line up down the
#        keyboard and read as one list of what the pad reaches.
# label  beside the character, the two centred together as a pair.
badge_align = "right"

repeat_delay_ms = 350         # hold a direction this long before it walks
repeat_rate_ms = 70           # then one key every this many ms
# And how much faster, the longer the direction is held - `[menu]` has the
# same pair and the same argument. It matters most here: the first page is
# fourteen keys across, which is the widest thing this program asks anybody to
# walk, and the steps closing up is what keeps crossing it a push rather than
# a count. 1.0 turns it off.
repeat_ramp = 2.5
repeat_ramp_ms = 1000
# socket = "/run/user/1000/omapad/osk.sock"   # defaults to $XDG_RUNTIME_DIR

# What the microphone key on the bottom row runs. It types nothing itself: it
# starts dictation, and whatever it started types at the cursor, so a sentence
# is said instead of walked letter by letter with a thumb. Pressing it again
# stops and the words arrive a moment later.
#
# The key is only on the keyboard when the first word of this is a program the
# machine has - no dictation installed, no key, and the space bar keeps the
# cell. Set it to "" to take the key away on a machine that does have one.
# A command that needs an environment set in front of it wants a small script
# to be the first word instead, since only the first word is looked for.
#
# voxtype ships with Omarchy: menu > Install > AI > Dictation. Its model, its
# language and its microphone are its own settings (`voxtype configure`), and
# omapad deliberately does not reach into them - the English model it installs
# by default will not transcribe another language.
dictate = "voxtype record toggle"

# Push to talk, which is the same microphone held open rather than switched
# on: `osk:talk` runs the first when the button goes down and the second when
# it comes up. The shipped scheme puts it on a hold of MINUS, the button that
# opens the keyboard - tap for the keyboard, hold to say it instead.
#
# Two commands rather than one, because a gesture that ends when a finger
# lifts cannot ask the tool which way it is currently pointing. A toggle that
# fell out of step once would stay out of step.
talk_start = "voxtype record start"
talk_stop = "voxtype record stop"

# Where that program says what it is doing, so the key can be lit while the
# microphone is open and lit more quietly while what was said is still being
# turned into text. One word per line - `idle`, `recording`, `transcribing`.
# A file rather than a command, because it is read several times a second and
# a helper spawned that often to answer one word is a helper too many.
# Empty means nothing is read and the key never lights; it still works.
dictate_state = "$XDG_RUNTIME_DIR/voxtype/state"

# Where dictation puts what was said: at the cursor, or on the clipboard. A
# switch on `Audio` rather than a line in this file, because the answer is
# about the window in front of you rather than about this machine - a text
# field takes typing, and a game, a terminal running something, or a window
# that is not yours at all takes nothing, so the sentence is gone.
dictate_clipboard = false

# And what says so, because omapad never sees the words: voxtype types them
# itself and leaves no transcript behind, so the only thing there is to switch
# is voxtype's own `[output] mode`. These two are what the switch runs, and
# they are a default rather than a mechanism - they fit the voxtype Omarchy
# installs, whose shipped config has that key under that heading. A machine
# that keeps it somewhere else replaces them rather than going without the
# switch. The daemon is restarted because it reads that file when it starts.
#
# Both or neither: a switch that can only go one way is not a switch, and
# `omapad check` says so.
dictate_clipboard_on = '''
  sed -i '/^\[output\]/,/^\[[a-z]/ s/^mode *=.*/mode = "clipboard"/' \
    "${XDG_CONFIG_HOME:-$HOME/.config}/voxtype/config.toml" &&
  systemctl --user try-restart voxtype.service
'''
dictate_clipboard_off = '''
  sed -i '/^\[output\]/,/^\[[a-z]/ s/^mode *=.*/mode = "type"/' \
    "${XDG_CONFIG_HOME:-$HOME/.config}/voxtype/config.toml" &&
  systemctl --user try-restart voxtype.service
'''

# Per-key overrides for the on-screen keyboard, keyed by what the key does by
# default. Either half is optional, and a bare string is taken as the label:
#   BACKSPACE = ""              # relabel it
#   close     = { label = "" }  # the key that puts the keyboard away
#   DELETE    = { label = "Delete" }
# The shell draws with the same Nerd Font the rest of Omarchy uses, so its
# glyphs work as labels. A key that appears on more than one page is
# overridden on all of them, and `omapad check` rejects an action that does
# not parse.
[osk.keys]
# Caps Lock, the long way round. Omarchy's own layout sets
# `compose:caps,shift:both_capslock_cancel` (/usr/share/omarchy/default/hypr/
# input.lua), which turns the Caps Lock key into Compose - so sending
# KEY_CAPSLOCK toggles nothing at all. The same option makes *both shifts
# together* the way to toggle caps lock, which is what this sends. On a layout
# that has not been remapped, put it back with:
#   CAPSLOCK = { action = "CAPSLOCK" }
CAPSLOCK = { action = "LEFTSHIFT+RIGHTSHIFT" }

[gamebar]
# The game-mode bar. Omarchy's own bar is hidden in game mode (see
# `hide_bar_in_game`) because every widget on it opens a popup you click, and
# in game mode there is no pointer; this is what stands in its place. Left, the
# controller menu and the button that opens it; centre, the workspaces; right,
# what the buttons under your thumbs do.
#
# It prints only what is true: the bindings live in the layer that is live
# right now, resolved through exactly the path a press takes. Hold the window
# trigger and the hints become that layer's. The bar goes away while the pad is
# handed to an app, since none of it would answer then.
#
# On by default, because `hide_bar_in_game` is: game mode that took the bar
# away and put nothing back would leave the screen with no way to read where
# you are, or to remember the way out. Turn both off together for a game mode
# that changes what the sticks do and nothing you can see.
enabled = true
# The bar has three slots on the right and they are worth spending on what is
# different about where you are. A gesture that means the same wherever you are
# - confirm, go back - teaches nothing by being repeated, so it is left off.
#
# Listed by *action* rather than by button on purpose: move Enter to another
# button and it stays unprinted; give A something else to do and A starts being
# printed. A list of button names would go stale the first time the scheme
# changed.
omit = ["key:ENTER", "key:ESC"]
# And which part of the pad those three slots are about: the half that changes
# under you. An application profile rewrites X, Y and the two stick clicks - it
# has four things to spend and those are the four - and a layer rewrites all of
# them, so what they mean where you are standing right now is what a hint is
# for. Naming the face buttons and leaving the stick clicks out printed two of
# a profile's four and hid the rest.
#
# A shoulder or a trigger is the other case and stays out: RT clicks, LB and RB
# walk the workspaces, wherever the scheme goes - so a slot spent on one
# repeats what the pad told you the first time you pressed it, in place of
# something you did not know yet. Nothing is lost by leaving them out either:
# the two that walk the workspaces are drawn beside the workspaces, and the one
# that opens the menu stands on the left.
#
# Three slots and four buttons means one falls off, in PREFERRED's order -
# thumbs-first, so L3 is the one that goes. That is the right one to lose: L3
# is the cheapest of the four wherever it is spent, the click a profile reaches
# for once X, Y and R3 are gone, and the guide is where the whole scheme is
# read anyway.
#
# By kind rather than by button, which is the grouping the guide reads by:
# "face", "bumper", "trigger", "dpad", "stick", "system". Name the ones you
# want back - `kinds = ["face", "stick", "trigger"]` - and they are offered in
# the order the thumbs reach them, up to the same three.
kinds = ["face", "stick"]
# One word per hint, or the phrase the guide prints. The bar is glanced at
# over the top of a game with three slots to say where you are in; the guide is
# the page you sit and read. So the bar prints the verb and stops - `Keyboard`
# rather than `On-screen keyboard`, `Mute` rather than `Mute the microphone`.
#
# The word is the binding's own `short` where it says one, the first word of
# its `desc` where it does not, and the action's own short name where the
# binding says nothing at all. The first word is the verb often enough to be
# the rule - `Clear the screen` is Clear - and where it is not, the binding
# says so itself:
#
#   X = { tap = "key:CTRL+T", desc = "New tab", short = "Tab" }
#
# `hold_short` is the same for the other half. Turn this off for the guide's
# full phrase on the bar as well - a bar across a room, or a scheme whose
# bindings are hard to name in one word.
brief = true
# Which edge the bar sits on. "auto" follows Omarchy's own bar: move that one
# to the bottom and this one goes with it, so the couch bar is where the
# desktop bar taught you to look. "top" or "bottom" pin it regardless.
#
# Only those two edges: Omarchy's bar can also stand on the left or the right,
# but this one is a horizontal readout - a menu at one end, the workspaces in
# the middle, the live bindings at the other - and turning that on its side is
# a different bar, not this one rotated. A vertical desktop bar leaves both
# horizontal edges free anyway, so "auto" takes the top.
position = "auto"
# How tall the bar is, in the same units Omarchy's own bar is 26 of - the
# shell's spacing scale multiplies it, and so does `[ui] game_scale`, so a
# theme that runs roomier gets a roomier bar here too, and so does a couch
# further from the screen. Big enough to read from a sofa is the whole point of
# not reusing the 26px desktop bar; past that it is only eating screen, so the
# default is the row of badges plus a little air. Lower it if your sofa is
# closer, raise it if it is further. The plugin will not go below what the
# badges need, so a very small number just gets you the tightest bar that still
# shows what the bar is for.
height = 32
# Where the app in front has claimed a shoulder - a browser's tabs, Steam - the
# workspace is only reachable behind the announced hold, so the badge beside
# the workspace strip is drawn dimmed: it still points at the workspaces, but
# not at a tap, and a badge that looked the same would be promising something
# a press will not do. Holding it walks the dimming off over exactly as long as
# the hold takes, so the countdown is visible as well as felt.
#
# Dimmed rather than coloured on purpose: "not at a tap" is contrast, and a
# fixed hue would fight a bar whose foreground is chosen per wallpaper.
#
# Three states, one per phase of the gesture: dimmed while it sits there,
# filling in from the left while you hold it, and at the tick - leaning once
# towards the workspace it is about to reach, while the sweep it filled with
# runs back out over the confirm window. The tick and the notification both
# happen away from the bar, so the badge says it too. It never fills twice:
# the confirm window is the same wait continuing, and a second fill read as a
# second, separate one - so the same sweep empties instead, and is gone at the
# moment the press fires.
#
# The lean and the sweep answer different questions on purpose. Which way this
# is about to move things is a fact, so it is said once and held; how much
# longer is a countdown, so it is said by the only thing that can count. Both
# at once, and neither reads.
#
# How far that lean carries the badge, in the same units as `height` above.
# Small on purpose: the lean only has to say which way, and the sweep beside
# it is doing the talking - a badge that leaves its place in the row draws the
# eye off the thing it is announcing. Raise it if the bar is across a room; 0
# leaves the badge where it is and lets the sweep say the whole of the window,
# which is what a badge with no direction to lean in does anyway.
confirm_lean = 2
# How long the badge stays dimmed before it starts filling. A fill that begins
# on contact flickers under a shoulder tapped to walk browser tabs - the
# commonest press these buttons take - so it sits still for a moment first.
# The fill is still full at the tick: the wait comes out of the ramp, not off
# the end, so a longer delay means a faster fill over what is left of
# `hold_ms`. Raise it if a flick still flashes, lower it towards 0 - fill from
# the moment the button goes down - if the hold feels slow to answer.
confirm_fill_delay_ms = 60
# Whether the badges on the bar are clickable. The bar was drawn for a thumb -
# it stands in for a desktop bar whose every widget wants a pointer - but game
# mode is the couch environment rather than a hand-off, so the desktop is still
# under it and a mouse may well still be on the desk. A badge that says what a
# button does is then the obvious thing to click, and clicking it fires exactly
# the binding the press would: the same layer, the same profile, the same path.
#
# Only the badges do anything; a click elsewhere on the strip lands on the bar
# and stops there, the way it does on a desktop bar's background. Turn this off
# for a strip a click passes straight through, as it did before.
#
# Whichever way this is set, a badge lights up while its button is down - that
# is the bar answering the pad, not a control.
click = true
# socket = "/run/user/1000/omapad/gamebar.sock"  # defaults to $XDG_RUNTIME_DIR

[status]
# What the daemon is doing, pushed to the Omarchy bar widget: whether a pad is
# connected, which mode it is in, and which app profile is active. The widget
# is part of the same shell plugin - add `{ id = "canerakdas.omapad" }` to
# a section of the bar layout in ~/.config/omarchy/shell.json to place it. It
# hides itself when no daemon is talking, so nothing is drawn for a service
# that is not running.
# socket = "/run/user/1000/omapad/status.sock"  # defaults to $XDG_RUNTIME_DIR

[mapping]
# The controller mapping screen. omapad names buttons by what is printed on
# the pad and picks a profile from what the driver reports - two facts that do
# not always agree, which is how a pad ends up answering to its neighbour's
# name. The screen asks for each button by name, writes down the code that
# arrives, and saves it per device identity in ~/.config/omapad/mapping.toml.
# Delete that file to put every pad back on its shipped profile.
#
# It reads the pad raw while it is up - no binding fires, because the map that
# would resolve one is the thing being fixed - so it carries its own way out: a
# button that already has a name skips the one being asked for (an Xbox pad has
# no Capture), holding anything for 2.5s leaves without saving, and the last
# step asks for A to save and B to discard, in the names it has just learned.
# socket = "/run/user/1000/omapad/mapping.sock"  # defaults to $XDG_RUNTIME_DIR

# ---------------------------------------------------------------------------
# What the machine is doing, rather than what omapad holds: how loud it is, how
# bright, and what is playing. A tile reads one of these with
# `reads = "live:volume"`, and a button can drive one with `live:volume=up` -
# the twin of `pad:`, and the same grammar, so a button reads the same
# whichever of the two it is pointed at.
#
# Every one is a command, and every command is a setting. omapad runs a string
# and parses what comes back; it knows nothing about PulseAudio, backlights or
# MPRIS, and a machine that answers these questions some other way answers them
# by editing this table. `%1` is where the new value goes, as a whole percent.
# An empty string is a reading this machine does not have: nothing is asked
# for it, and a tile that reads it draws blank.
#
# Nothing here is asked while the menu is shut, and nothing is asked at frame
# rate: a reading is read once when its tile appears, again after a press has
# changed it, and otherwise only while its own tile is selected.
[live]
# Volume goes to the sink rather than through `omarchy-audio-output-volume`,
# and that is deliberate: the helper always ends in `omarchy-osd`, so every
# press from the HUD would raise Omarchy's own overlay *over the tile showing
# the same number*. `omarchy-audio-output-sink` is what the helper itself
# resolves with, so a speaker tuning chain is still respected. Put the helper
# back here if you would rather have the OSD.
volume_read = 'pactl get-sink-volume "$(omarchy-audio-output-sink)"'
volume_set = 'pactl set-sink-volume "$(omarchy-audio-output-sink)" %1%'
mute_read = 'pactl get-sink-mute "$(omarchy-audio-output-sink)"'
mute_set = 'pactl set-sink-mute "$(omarchy-audio-output-sink)" %1'

# Brightness keeps its helper: DDC, Apple displays and backlights are three
# code paths omapad must not reimplement. `--no-osd` is the same argument as
# above, and this one the helper offers.
brightness_read = "omarchy-brightness-display"
brightness_set = "omarchy-brightness-display --no-osd %1%"

# What is playing, as one line of JSON. The write takes one of MPRIS's own
# three words - playPause, next, previous.
media_read = "omarchy-shell media status"
media_set = "omarchy-shell media %1"

# Whether the screen's refresh may follow a game's frame rate. Read from the
# option rather than from the monitor, which says whether it is following one
# *now* - no, on a desktop, whatever the switch says. On is Hyprland's 2,
# fullscreen only, because that is where the games are and a desktop whose
# rate wanders with a cursor flickers on some televisions; put 1 in its place
# to have it everywhere. Set while Hyprland runs and not written to its
# config, so a reload puts back whatever that says - off, where it says
# nothing.
vrr_read = "hyprctl getoption misc:vrr"
vrr_set = 'hyprctl eval "hl.config({ misc = { vrr = $(( %1 * 2 )) } })"'

# Whether the screensaver and the lock stay away. Omarchy's own switch, so the
# bar's indicator and its own menu agree with the tile: the shell watches the
# file this writes and needs telling nothing.
stay_awake_read = "omarchy-toggle-idle status"
stay_awake_set = 'omarchy-toggle-idle "$([ %1 = 1 ] && echo stay-awake || echo allow-idle)"'

# The warm screen. Omarchy's helper only flips, so the write asks first and
# flips only when the answer is not already the one wanted - a press that
# landed twice would otherwise put it back.
nightlight_read = "omarchy-toggle-nightlight --status"
nightlight_set = '[ "$(omarchy-toggle-nightlight --status | jq -r .enabled)" = "$([ %1 = 1 ] && echo true || echo false)" ] || omarchy-toggle-nightlight'

# The radio. The helper answers with its exit status, so the read says it in
# a word; the write goes through it rather than bluetoothctl because the off
# it makes is an rfkill block, which is the half that survives a reboot.
bluetooth_read = "omarchy-bluetooth-power is-on && echo on || echo off"
bluetooth_set = 'omarchy-bluetooth-power "$([ %1 = 1 ] && echo on || echo off)"'

# Do not disturb, asked of Omarchy's notification service itself, which
# answers in the words the reading wants. Nothing answers while the shell is
# down, and the tile stays blank rather than guessing.
dnd_read = "omarchy-shell notifications isDnd"
dnd_set = "omarchy-shell notifications setDnd %1"

timeout_ms = 1000             # how late an answer may be before it is dropped
poll_ms = 2000                # how often the selected tile is re-asked
settle_ms = 250               # and how long after a press the helper is asked

# How often a number somebody is still moving is actually sent. A level
# supersedes the one before it, so the ones in between are round trips for a
# value nobody stopped on - and `volume_set` is a shell, a helper that names
# the sink and a `pactl`, about thirty milliseconds, while the loop asks at
# `[pointer] poll_hz`. Sent one per frame, a thumb sweeping a dial queues most
# of a second of work: the sound arrives late and the check that lands while
# the queue is draining reports a sink halfway through it, which rewinds the
# ring under your thumb.
#
# So a number is held and the newest one goes out on this beat; the last one
# always goes, whatever the beat. Lower it to have the machine follow a thumb
# more closely, raise it if a helper on this machine is slower than most.
# Switches and the player's own buttons are never held - two presses of Next
# mean two tracks.
write_ms = 60
                              # what it actually did

# ---------------------------------------------------------------------------
# What the machine underneath is doing (the readings the HUD draws).
#
# [live] above is what the *desktop* is doing - how loud it is, how bright,
# what is playing - and every one of its answers comes from a helper. These
# are what the *kernel* publishes about the hardware, so almost all of them
# are a file read rather than a command, and a file read is not something to
# spawn a shell for twice a second.
#
# Every source is a setting, in one grammar - `<how>:<where>` - because not
# one of these is true of every machine. Which chip holds a temperature,
# whether the graphics card publishes a load at all, whether anything on this
# desktop knows a game's frame rate: all three differ between two laptops of
# the same year.
#
#   proc:stat | proc:meminfo   the two files here has a parser for
#   mount:<path>               how full a filesystem is, by any path on it
#   hwmon:<chip>/<file>        a sensor, by the name the chip publishes
#   file:<path>                one number, from one file
#   cmd:<command>              a helper that prints one number
#
# `file:` and `cmd:` are the two that reach anything, which is why this list
# does not have to grow every time a driver publishes something new.
#
# **An empty source is a reading this machine does not have.** Nothing asks
# for it and no tile is drawn - which is what makes one page of readings
# correct on two machines, rather than a page with a tile on it saying
# nothing. Three ship with a source because three are true of every Linux.
# ---------------------------------------------------------------------------

[sysinfo]
cpu = "proc:stat"             # a share of the interval since the last read,
                              # across every core - not since boot, which is
                              # what one read of /proc/stat actually says
memory = "proc:meminfo"       # against MemAvailable, so the cache is not
                              # counted as memory anybody is short of
disk = "mount:/"              # name any path on the filesystem you want

# The rest are empty because guessing them is worse than not drawing them.
#
# A temperature is the clearest case: every machine has a hwmon chip and the
# numbers are not interchangeable, so a sensor picked for you prints the
# wrong number under the right word. Find yours, then name it:
#
#     grep . /sys/class/hwmon/*/name        # which chips this machine has
#     temperature = "hwmon:coretemp/temp1_input"
#     temperature = "hwmon:k10temp/temp1_input"
#
# The chip is named rather than numbered because `hwmon4` is a battery on one
# boot and a network card on the next - the name is the stable half. `*` is
# there for anyone who does not mind which sensor answers:
# `hwmon:*/temp1_input` takes whichever chip has a file of that name.
temperature = ""
fan = ""                      # e.g. "hwmon:thinkpad/fan1_input"

# The two with no general answer at all, so they arrive as a command and say
# what they count in. `gpu_unit` and `gpu_scale` are what turns a helper's
# number into the one a person reads: the unit is printed on the tile, and the
# scale is what the number is divided by first.
gpu = ""                      # e.g. "cmd:nvidia-smi --query-gpu=utilization.gpu
                              #      --format=csv,noheader,nounits"
gpu_unit = "%"
fps = ""                      # e.g. "cmd:mangohud-fps" - whatever on this
                              # machine knows what a game is drawing
fps_unit = "fps"

poll_ms = 2000                # how often a reading on screen is asked again
timeout_ms = 1000             # how late a `cmd:` helper may be before it is
                              # dropped - nothing here waits on the loop

# ---------------------------------------------------------------------------
# The readings, left on screen (the HUD).
#
# Game mode takes Omarchy's bar away, which is the right trade for a screen
# watched from a sofa and leaves one question unanswered: what the machine is
# actually doing while it does it. This is the answer, and it is deliberately
# not a surface of its own design.
#
# What it draws is an ordinary [[menu.items]] group - `page` says which. So
# its tiles are written where every other tile is written, they are arranged
# with the gesture that arranges every other page (hold Y, carry one, let go),
# and the arrangement lands in the same layout.toml. Where a tile sits in the
# grid is where it sits on the screen, because it is the same grid.
#
# Two things follow, and both are the point: a tile that is not a readout is
# not drawn here - the page holds its own switch, and a switch is a thing to
# press - and a reading that has never answered draws nothing at all.
#
# It reads no pad input, takes no focus and passes every click through. There
# is nothing to press, which is the whole of why it can sit over a game.
# ---------------------------------------------------------------------------

[hud]
# Whether the readings are on screen. A setting rather than a surface verb:
# it is decided once and left, so it survives a restart the way the mode does.
# `omapad ctl hud on|off|toggle` and the switch on the page both go through
# this, which is what makes either of them still true tomorrow.
show = false
# Which group holds it, by id. A name rather than a position - a page that
# moved along the bar is still the same page. A config with no such group gets
# a HUD with nothing on it rather than a daemon that will not start.
page = "hud"
# How many rows the screen is cut into. **The grid here has a last row and the
# menu's does not**: a menu page is as many rows as its tiles came to and
# scrolls past the fold, so nothing in it means "the bottom". A screen has a
# bottom edge, so a tile carried into the last row and the last column has to
# arrive in the corner of it.
#
# So this is the divisor as well as the limit, and the two cannot be separated:
# a cell is a share of the screen rather than a number of pixels, which is the
# only way the grid can end where the screen does. Raise it for thinner tiles
# and finer placement - and more presses to cross the page; lower it for fewer,
# bigger ones. `[menu] cell_height` is the same question for the menu's own
# grid and is deliberately a different answer.
rows = 12
# How far off the edge of the screen the grid starts, unscaled. Not the menu's
# own margin, which keeps a television's overscan clear of a fullscreen card's
# first tile - a corner here is one somebody put something in on purpose, so
# this is a hair off the edge and 0 is the corner itself.
margin = 16
# How solid the readings are over what is behind them. A HUD is read while
# something else is being watched, so the thing it is over has to stay
# watchable: at 1 it is opaque over the game, and far below this it is a
# number you have to look for.
opacity = 0.9
# socket = "/run/user/1000/omapad/hud.sock"    # defaults to $XDG_RUNTIME_DIR

[guide]
# The bindings guide: one page per layer, every button drawn as the button it
# is. Read-only - it is a map, not an editor - and summoned from the menu or
# with `omapad ctl guide toggle`. Descriptions come from the actions
# themselves; a binding with a `desc` says it in its own words instead.
# socket = "/run/user/1000/omapad/guide.sock"  # defaults to $XDG_RUNTIME_DIR

[chrono]
# The stopwatch behind a `chrono` tile - one measurement, however many faces
# draw it. The cycle (start, stop, reset) and the pusher (A) are the
# instrument rather than anything to choose, so this switch is the whole of
# what there is to decide about it.
#
# A tick under the thumb every time the sweep hand comes back to twelve, so a
# measurement can be followed without looking at it - which is most of what a
# stopwatch left running while you do something else is worth. It strikes the
# minute and only the minute: the mark is the hand coming round, not a length
# of time you set, and an alarm you can set is a different instrument. Turn it
# off for a stopwatch that is read rather than felt. `[rumble] enabled` still
# wins - this asks for a tick, it does not turn the motor on.
rumble = true

[window]
step = 900.0                  # window move/resize pixels per second (window layer sticks)
update_hz = 30.0

# ---------------------------------------------------------------------------
# The terminal's half of the window layer's Close (item 49).
#
# `ZL` + B closes the window in every application, and a terminal is the one
# where closing is not always what was meant: a command still running is the
# thing in front of you, and closing the window kills it along with the
# scrollback that said what it had done. So `term:interrupt` asks the terminal
# first - is anything running? - and interrupts what is. With nothing running
# it closes exactly as it always did, and so does every window that is not a
# terminal: nothing under those has a prompt to ask about.
#
# The question is answered from /proc. A pty publishes the process group a
# Ctrl+C would be delivered to, and while that is the shell's own, the prompt
# is what is in front. A shell inside tmux or screen belongs to the
# multiplexer's session rather than to the window, so a busy pane there reads
# as idle and the window closes - the same as before this existed.
# ---------------------------------------------------------------------------

[terminal]
# What is sent while a command is running. Any action a binding can carry, so
# a shell driven with something other than Ctrl+C says so here.
interrupt = "key:CTRL+C"
# And what happens with nothing to interrupt - the close this button did before
# it asked anything. A scheme that closes windows some other way changes it
# here rather than losing the interrupt along with it.
idle = "hypr:hl.dsp.window.close()"
# How far below the focused window's process to look for the shell. Every
# emulator measured here starts it as a direct child, so this is already
# generous; raise it for a terminal reached through a wrapper script. The walk
# only goes down, so a bigger number costs a bigger read of /proc and nothing
# else - it can never reach out of the window it was asked about, and a ceiling
# in the code stops any value here from making a press expensive (a terminal's
# whole tree is 24 reads and a tenth of a millisecond; the ceiling is 256).
depth = 4

# ---------------------------------------------------------------------------
# Chords: buttons pressed together, in either order.
#
# A chord takes the press outright - neither button also does its own job, and
# a layer trigger inside one does not open its layer. They are global rather
# than per-layer on purpose: the one below is the way in from inside a game,
# and that has to work from wherever you are.
#
# A chord is also the one gesture that always reaches past an app holding the
# pad, whatever it runs. Two buttons at once is not an input any game asks you
# for, which is what makes it safe there - and once PLUS and MINUS stand aside
# over a game (see [bindings.base]), it is the only way back in.
# ---------------------------------------------------------------------------

[chords]
# Back + Start together opens the controller menu. Over a cloud session or a
# game this is *the* door: everything else - the keyboard, the window ops, the
# guide - is a row inside it.
#
# This used to be `mode:toggle`, which did not need a chord: HOME held for 700ms
# toggles the mode in every layer, in the menu and over a game alike. The menu
# had no way in over a game, and it is the one that has to be reachable from
# inside a game.
"MINUS+PLUS" = "menu:toggle"

# A trigger and B: the workspace lock. The hand-off is automatic and asks the
# program itself, which is right about every game whose opening of the pad
# /proc can see - and two things are left over. A game the walk misses gets
# nothing while the pad drives the desktop over the top of it, and a game that
# does have the pad still sees the two gestures that reach past it: the
# announced hold Steam's profile puts a workspace on is two seconds of resting
# a thumb on a shoulder, which happens mid-fight. Locked, the pad is the
# app's outright and only a chord gets through - which is MINUS+PLUS, the
# menu, and so the way back out. The menu row says the same thing and ticks
# while it is on.
#
# Both triggers, because which one a thumb is not already using is the game's
# business, not ours. It fires **only while the app in front has the pad**: on
# the desktop ZL + B closes the window and that is not a press to spend, and
# over a game these two cost nothing at all - the grab is off there, so the
# game sees both buttons whatever this does with them.
"ZL+B" = "lock:on"
"ZR+B" = "lock:on"

# ---------------------------------------------------------------------------
# Layers: hold the button to reach a second set of bindings.
# ---------------------------------------------------------------------------

[layers.window]
# The left trigger. A modifier for window ops has to be held by a finger that
# is not a thumb - inside the layer both thumbs are busy with the D-pad and the
# face buttons - which leaves the shoulders and the triggers. The bumpers walk
# workspaces and that is worth keeping, so the trigger it is; its right-click
# moved to Y, which was a duplicate of B.
button = "ZL"
left_stick = "resize"         # resize the focused window
# One role with two answers, because Hyprland has two verbs and each ignores
# the other's window: a floating window is dragged where the stick points, and
# a tiled one changes places with the window that way. The role asks which it
# is holding once per push - the alternative was a stick that looked dead in
# the layout most windows are actually in. Set this to "swap" for the tiled
# half alone, or "move" behaves as before on a desktop with nothing floating.
right_stick = "move"          # move a floating window, swap a tiled one
fallthrough = false           # true = unbound buttons fall back to [bindings.base]
# `reaches_past = true` here would keep the whole layer working while the pad
# has been handed to the app in front. It is off because the app sees ZL too:
# in a game ZL is aim, and ZL + A would put the window full-screen mid-fight.
# Over a game the window ops are on the menu instead.
reaches_past = false

# ---------------------------------------------------------------------------
# Base layer - pointer and everyday navigation.
# ---------------------------------------------------------------------------

[bindings.base]
# Console-shaped scheme (item 07): A confirms, B goes back, the triggers click.
A = "key:ENTER"
B = "key:ESC"
X = "click:middle"
Y = "click:right"
LSTICK = "click:middle"
RSTICK = "click:back"
# ZR clicks; ZL holds the window layer, so it has no binding of its own.
# It stays a plain click: a game reading the trigger is holding it constantly,
# and `reaches_past = true` here would left-click the desktop with every shot.
ZR = "click:left"

# MINUS (Xbox "Back"/View) used to hold the window layer. Free now, and the
# on-screen keyboard is what it is worth spending on: one button instead of a
# two-handed combination.
#
# `reaches_past = false` on both this and PLUS below: a summon reaches past an
# app holding the pad by default, and for these two that is the wrong default.
# Back and Start are buttons every game binds, so over a cloud session or a
# game they would put our keyboard and our menu on screen every time you
# reached for the game's own pause screen. Over a game the way in is the
# MINUS+PLUS chord, and the keyboard is a row inside the menu. Take these two
# keys out to have Back and Start summon over a game again.
#
# **The hold is push to talk**, and it is the one gesture on this pad that
# lasts rather than fires: the microphone is open for exactly as long as the
# button is down, and the words arrive when the thumb comes off. It costs
# nothing - a long press on MINUS did nothing before - and it is on this
# button because typing is what MINUS is already about: tap for the keyboard,
# hold to say it instead. `[osk] talk_start` / `talk_stop` are the commands,
# and with neither installed the hold does nothing rather than something
# wrong. `reaches_past = false` covers it too, so a game still gets its own
# Back button held.
MINUS = { tap = "osk:toggle", hold = "osk:talk", hold_desc = "Speak instead of typing", hold_short = "Speak", reaches_past = false }

# L and R walk the previous / next workspace.
# `on_release = true`: the shoulders fire when they come back up, not on the
# way down. An app profile can then give the same button a hold (see
# [profile.browser]) without its tap having already gone out, and the shoulders
# behave the same everywhere whether or not one does.
L = { tap = "hypr:hl.dsp.focus({ workspace = 'r-1' })", desc = "Previous workspace", on_release = true }
R = { tap = "hypr:hl.dsp.focus({ workspace = 'r+1' })", desc = "Next workspace", on_release = true }

DPAD_UP = "key:UP"
DPAD_DOWN = "key:DOWN"
DPAD_LEFT = "key:LEFT"
DPAD_RIGHT = "key:RIGHT"

# Two menus, one per button, the way a console splits them. HOME - the button
# in the middle of the pad, the Xbox button - opens the controller menu, the
# place with every group in it: the button a console spends on its home.
# PLUS - Start, the Xbox pad's ☰ - opens the quick menu, one row of what
# somebody pauses for (see [quick]): the button a game spends on pausing.
#
# HOME's tap used to be the next window. It is a row under Spaces ›
# Windows in the menu now, because the menu had nowhere better to be than the
# button that carries its name on every console. The hold is still the mode.
#
# PLUS carries nothing on a hold. It carried the real Omarchy menu for a while,
# and a button that opens one menu when tapped and another when held a beat
# too long is a button whose press is a guess - the Omarchy menu is a tile
# under System instead. And `on_press`: PLUS is half of the MINUS+PLUS chord,
# so it would otherwise wait for its release to find out which it was, and a
# menu that only opens when the thumb comes off reads as a button that wants
# holding. It opens on the way down; MINUS landing while it is still held
# turns the press into the chord, and the controller menu takes the row's
# place.
#
# Over a game the two are not symmetrical, and that is on purpose. PLUS keeps
# `reaches_past = false`: Start is the game's own pause button, and a quick
# menu on top of every pause screen is the fault that setting exists for - so
# over a game the way in is the MINUS+PLUS chord, and PLUS inside the menu it
# opens. HOME says nothing, so both its halves reach past the way a summon
# does: its hold is the mode switch, which has to work over a game, and a
# binding cannot let one half through and keep the other back.
# `reaches_past = false` here gives up both.
#
# `on_press` on HOME for the reason it is on PLUS, and it was worse here: the
# hold is the mode switch, so a tap that only answered on the release, held a
# moment longer to make sure, switched the mode instead of opening the menu.
# The menu opens as the button goes down now; held on to the switch, the menu
# closes again and the mode changes.
PLUS = { tap = "quick:toggle", desc = "Quick menu", short = "Quick", on_press = true, reaches_past = false }
HOME = { tap = "menu:toggle", hold = "mode:toggle", hold_ms = 700, desc = "Controller menu", short = "Menu", on_press = true }
# Both halves of this one shorten to `Capture`, which on a bar of three words
# says nothing about which half you are getting.
CAPTURE = { tap = "exec:omarchy-capture-screenshot", hold = "exec:omarchy-capture-region", hold_ms = 500, short = "Screenshot", hold_short = "Region" }

# ---------------------------------------------------------------------------
# Window layer - hold ZL (left trigger). ZL is the trigger, so it can't also be
# a binding inside the layer; the shoulders move a window between workspaces,
# the same direction each walks the workspaces with at the base layer.
# ---------------------------------------------------------------------------

[bindings.window]
A = { tap = "hypr:hl.dsp.window.fullscreen({ mode = 'fullscreen' })", desc = "Fullscreen" }
# Close, and the one window that is asked first: a terminal running a command
# is interrupted instead, and closes on the press after that. See [terminal] -
# both halves are settings, and every window that is not a terminal takes the
# `idle` half, which is the close this line has always been.
B = { tap = "term:interrupt", desc = "Close the window, or the command in it" }
X = { tap = "hypr:hl.dsp.window.float({ action = 'toggle' })", desc = "Float / tile" }
Y = { tap = "exec:omarchy-hyprland-window-pop", desc = "Pop the window out" }

# `r-1` / `r+1`, not `e-1` / `e+1`: `e` walks only the workspaces that are
# already open and wraps around them, so a window could never be sent to an
# empty one. `r` counts every workspace on the monitor and creates the empty
# one it lands on, which is what the base layer's L / R already do.
L = { tap = "hypr:hl.dsp.window.move({ workspace = 'r-1' })", desc = "Send to previous workspace" }
R = { tap = "hypr:hl.dsp.window.move({ workspace = 'r+1' })", desc = "Send to next workspace" }

# These focus the window without moving the pointer. Swap `hypr:...` for
# `snap:up|down|left|right` to take the pointer with it, which is what you want
# from the couch - the focused window and the thing under the cursor being two
# different windows is the desktop's habit, not a useful one on a sofa.
DPAD_UP = { tap = "hypr:hl.dsp.focus({ direction = 'u' })", desc = "Focus up" }
DPAD_DOWN = { tap = "hypr:hl.dsp.focus({ direction = 'd' })", desc = "Focus down" }
DPAD_LEFT = { tap = "hypr:hl.dsp.focus({ direction = 'l' })", desc = "Focus left" }
DPAD_RIGHT = { tap = "hypr:hl.dsp.focus({ direction = 'r' })", desc = "Focus right" }

PLUS = { tap = "hypr:hl.dsp.layout('togglesplit')", desc = "Toggle split", short = "Split" }
HOME = { tap = "hypr:hl.dsp.window.center()", desc = "Centre the window" }
LSTICK = { tap = "hypr:hl.dsp.window.pin()", desc = "Pin the window" }
CAPTURE = "exec:omarchy-capture-screenrecording"

# Text entry: MINUS does this at the base layer now, but the old combination
# still works.
RSTICK = "osk:toggle"

# ---------------------------------------------------------------------------
# Traversal, and why it is not a layer here.
#
# `focus:*` can be put on any button, and a held layer of its own is the
# obvious shape for it. It is not the shipped one because a layer trigger costs
# a button outright: `layer_for_button` is checked before any binding, so the
# button that opens a layer has no binding of its own in any layer or profile.
# The cheapest candidate on this pad, X, would still have taken float / tile
# out of the window layer and Ctrl+T out of the browser.
#
# So traversal ships on a stick instead, in game mode, where it costs nothing
# at all - see `right_stick` under [mode]. A layer is three lines away if you
# would rather spend a button:
#
#   [layers.traverse]
#   button = "X"
#   fallthrough = true
#
#   [bindings.traverse]
#   DPAD_LEFT = "focus:prev"
#   DPAD_RIGHT = "focus:next"
#   DPAD_UP = "focus:up"
#   DPAD_DOWN = "focus:down"
#   A = "focus:activate"
#   B = "focus:back"

# ---------------------------------------------------------------------------
# Keyboard layer - active whenever the on-screen keyboard is up.
#
# This layer is implicit: it has no [layers.osk] entry because it activates
# with the keyboard rather than while a button is held. Holding MINUS still
# wins, so window controls stay reachable while typing. The sticks keep doing
# what they do on the base layer, so the pointer still works - which is what
# every implicit layer does except the menu, and [menu] left_stick says why.
# ---------------------------------------------------------------------------

[bindings.osk]
DPAD_UP = "osk:up"
DPAD_DOWN = "osk:down"
DPAD_LEFT = "osk:left"
DPAD_RIGHT = "osk:right"

A = "osk:press"
B = "osk:close"
X = "key:BACKSPACE"
Y = "key:SPACE"

L = "osk:layer:prev"
R = "osk:layer:next"

# The triggers, while the keyboard is up. ZL is Shift for as long as it is
# held - a real Shift, not the one-shot latch, so a whole capitalised word
# costs one finger - and ZR is "done": Enter, then the keyboard goes away.
#
# ZL holds the window layer everywhere else. It cannot do both, and typing is
# what the keyboard is for, so while it is open the window layer waits: the
# keyboard's own binding outranks the layer trigger.
ZL = "osk:hold:shift"
ZR = "osk:submit"

PLUS = "key:ENTER"
# HOME is the controller menu everywhere, here included: opening it puts the
# keyboard away first, so the one press is both the way out and the way in.
HOME = { tap = "menu:open", hold = "mode:toggle", hold_ms = 700, on_press = true }
# L3 toggles Caps Lock as it does in item 07's base scheme. Through osk:caps
# rather than a key: chord, so the printed letters follow the state and the
# Caps key stays the one place that decides what gets sent.
LSTICK = "osk:caps"
# The same button that summoned the keyboard puts it away again - and the
# same hold says it instead of typing it, which is the half of the pair this
# layer is the whole reason for.
MINUS = { tap = "osk:toggle", hold = "osk:talk", hold_desc = "Speak instead of typing", hold_short = "Speak" }
# Left click, displaced from ZR by Shift. Clicking into another field is worth
# keeping while the keyboard is up, and the right stick is already the thing
# aiming the cursor. Not CAPTURE: that button only exists on the NS-mode
# profile, so a click parked there would do nothing in XInput mode. Closing the
# keyboard was on six buttons anyway.
RSTICK = "click:left"
CAPTURE = "osk:close"

# ---------------------------------------------------------------------------
# Menu layer - active whenever the controller menu is up.
#
# Implicit like the keyboard layer, and it outranks it: opening the menu closes
# the keyboard, so only one surface ever reads the D-pad.
# ---------------------------------------------------------------------------

[bindings.menu]
# Four directions, one meaning: the tile that way. Left and right used to be a
# second way to say Back and Pick, which a single column left them free to be;
# a grid spends both axes on getting about, and A and B already say the other
# two things.
DPAD_UP = "menu:up"
DPAD_DOWN = "menu:down"
DPAD_LEFT = "menu:left"
DPAD_RIGHT = "menu:right"

# The bar. Both shoulders were unbound in this layer - a surface layer does not
# fall through to the one under it, so the workspace switcher is already gone
# while the menu is up - so this costs nothing at all.
L = "menu:group_prev"
R = "menu:group_next"

A = "menu:press"
B = "menu:back"                # at the top level this closes the menu
# X leaves outright, which is not what B does: B walks back up one submenu at
# a time, and from inside `Controller > Sticks` that is two presses. The other
# half of Back rather than a second one.
X = "menu:close"
# Y is the reach the face-button pattern asks for - see
# `docs/conventions/bindings.md` - and it carries two reaches, one on the tap
# and one on the hold. Both are things this page will not show you: that the
# tiles are yours to arrange, and what every button on the pad does.
#
# **Arranging is the tap.** It was the hold, on the argument that the guide is
# what somebody opening the menu in a hurry wants and rearranging is a thing
# you sit down to do. Measured against use, that is the wrong way round: the
# guide is a page you read once and the arrangement is a page you keep coming
# back to, tile by tile, and a gesture you make twenty times in a sitting does
# not belong behind a hold. The guide is also on a row of its own
# (`Controller > Buttons > Shortcuts`), so what went to the hold is the one
# with a second door.
#
# `desc` because the derived words for `guide:toggle` are "This view", which
# is only true when it is read from inside the guide - and this is read from
# the menu.
#
# What the hold costs is that Y acts on the way back up rather than on the way
# down, the way every tap/hold does - the same beat HOME already has in this
# layer.
Y = { tap = "menu:edit", desc = "Rearrange this page", short = "Arrange", hold = "guide:toggle", hold_ms = 700, hold_desc = "Bindings guide", hold_short = "Guide" }

# PLUS is the quick menu's button, and pressing it here goes there: the menu
# closes and the row opens in its place. It is what the MINUS+PLUS chord
# leads on to over a game, where PLUS on its own belongs to the game's pause
# screen - the chord opens this menu, and PLUS is then one press to the row.
PLUS = { tap = "quick:open", on_press = true }
HOME = { tap = "menu:close", hold = "mode:toggle", hold_ms = 700, on_press = true }
RSTICK = "menu:close"
CAPTURE = "menu:close"

# ---------------------------------------------------------------------------
# Quick menu layer - active whenever the quick menu (PLUS) is up.
#
# Implicit like the menu's, and above it: opening one closes the other, so
# only one of them reads the D-pad. The row is one-dimensional, so the two
# axes have a job each - left and right walk it, up and down nudge the value
# on the tile in front - and the shoulders walk it too, because a row of
# eight is walked end to end often enough to want the bigger buttons.
# ---------------------------------------------------------------------------

[bindings.quick]
DPAD_LEFT = "quick:left"
DPAD_RIGHT = "quick:right"
DPAD_UP = { tap = "quick:up", desc = "Turn up", short = "More" }
DPAD_DOWN = { tap = "quick:down", desc = "Turn down", short = "Less" }
L = "quick:left"
R = "quick:right"

A = "quick:press"
B = "quick:back"
# X is the menu's "leave outright". A row has no levels, so here it is the
# same way out as B - bound anyway, so the thumb that leaves the menu with X
# leaves this with it too, and left off the legend so it is not printed twice.
X = "quick:close"
# Y reaches for what is not on the row, which is everything else: the
# controller menu. HOME says the same thing, because HOME is that menu's
# button everywhere.
Y = { tap = "menu:open", desc = "Controller menu", short = "Menu" }

PLUS = { tap = "quick:close", on_press = true }
HOME = { tap = "menu:open", hold = "mode:toggle", hold_ms = 700, on_press = true }
RSTICK = "quick:close"
CAPTURE = "quick:close"

# ---------------------------------------------------------------------------
# Per-application profiles (item 09): a profile matches the focused window by
# class and layers its own bindings over the shipped ones, so an app changes
# only the buttons it names. Matching is a case-insensitive substring of the
# class, the first profile that hits wins, and a profile never reaches the
# keyboard, the menu or the guide - a surface on screen outranks the app under
# it.
#
# `[bindings]` is the app's scheme *at rest*, and it stops where a modifier
# starts (item 38): hold `ZL` and the window layer is the desktop's again, so
# `ZL` + `B` closes the window in every app whatever `B` is worth in the one in
# front. That is also the only reading under which the guide's window page -
# which knows nothing about profiles - tells the truth. An app that wants a
# window op of its own says which layer, `[profile.<name>.window]`, and that
# table is read in [bindings.window]'s place while it has focus. Any other key
# in a profile table is a typo, and `omapad check` says so.
#
# `handover = false` says the pad is never handed to this application, however
# many of its files it has open. The usual answer - has the focused app opened
# the pad? - is right for anything that opens one in order to be played with,
# and wrong for anything that opens one for another reason: Discord polls the
# Gamepad API for its own keybinds, and taken at its word it costs the pointer
# for as long as it is focused. /proc cannot tell the two apart, so the
# profile says which this one is. Only write it for an application you never
# play through; a game that lands here is a game the pad cannot reach.
#
# The browser is the pilot for the shoulders (item 18). L and R are its tab
# switcher as much as they are our workspace switcher, so inside it a tap goes
# to the app and only a deliberate hold takes the workspace: `confirm = true`
# takes both its numbers from [confirm] - at hold_ms it ticks the pad and says
# what is coming, and confirm_ms later it happens, with the bar filling the
# badge in over each.
# Letting go before then backs out, and so does the cancel button - which is
# what makes a tap that ran long harmless.
# ---------------------------------------------------------------------------

[confirm]
cancel_button = "B"           # backs out of any hold that is counting down
# What an announced hold costs, for every binding that says `confirm = true`
# rather than naming its own numbers: hold_ms is how long you hold before it
# ticks and says what is coming, confirm_ms how long the countdown after that
# runs before it fires. Letting go, or the cancel button, backs out of either.
#
# Both were two seconds when the countdown was invisible. The bar now fills
# the badge in from the left over each of them, so the wait can be read rather
# than guessed at, and a wait you can see does not have to be as long. Raise
# them if a shoulder fires while you are playing - the app in front sees that
# button too, which is the whole reason this is a hold and not a press.
hold_ms = 1200
confirm_ms = 800

# And what a hold costs the hands holding it. Both of these are about the
# gesture rather than about any one binding: two seconds of holding a shoulder
# is a thing some hands cannot do at all, and a pad held by a finger that
# shakes fires holds nobody asked for.
#
# `scale` multiplies every wait on the pad - the two above, a binding's own
# `hold_ms`, the half-second a plain hold takes - so a half here halves all of
# them together and 1.5 makes every one of them more deliberate. Half is the
# floor because below it a tap and a hold stop being different gestures;
# double is the ceiling because a hold nobody can reach the end of is a
# binding that has gone.
#
# From the pad it is seven places a quarter apart, drawn as seven segments and
# printed as a percentage of the length each binding was written at - unlike
# the corners and the motion, this is an *amount* rather than a place, and
# `Slower` would be a word standing where a quantity already reads.
scale = 1.0
# How long the finger may come off a hold that has **already announced
# itself** before the countdown is abandoned. Only after the announcement:
# before it, letting go is how a tap is made, and delaying that would cost
# every browser tab a beat.
#
# 0 ships, and it is the shipped promise - letting go is how you back out. Any
# other number says the countdown survives a slip instead, and the ways out
# are then the cancel button or a finger that stays off for this long.
slack_ms = 0

# Discord, where the four face buttons are the voice controls.
#
# A voice chat is the one desktop app whose most-pressed controls are not on
# screen where a pointer can reach them: the mute and deafen buttons sit in a
# strip the size of a thumbnail, in the corner furthest from wherever you are
# aiming. From a sofa that is the worst target on the desktop, and it is the
# one you hit mid-sentence. So the face buttons stop being the console scheme
# here and become the voice panel.
#
# A and B are the pair, next to each other on the pad the way they are in the
# app: mute the microphone, and deafen - the mic and everybody else's sound at
# once, which is what you press when the room you are in gets loud rather than
# the call. Both keep what they meant everywhere else on a hold, which is
# what Enter and Esc are worth in a chat window: Esc is also how Discord
# declines an incoming call, and a message is sent by the keyboard's own ZR
# (Enter, and the keyboard away) rather than by A.
#
# X and Y are the two the pointer is worst at. Ctrl+K is Discord's quick
# switcher - a server, a channel or a DM by name, which beats walking a
# sidebar with a cursor; and Ctrl+Enter answers an incoming call, the one
# thing here that is timed and cannot wait for you to aim at a small button.
#
# What this costs, in Discord only: the middle click (X, and the left stick
# click) is gone, and Enter and Esc are a hold rather than a press. The right
# click is not gone - it moves to the left stick click, because a context menu
# is how Discord replies to and reacts to a message, and losing that would
# cost more than it saved. None of it reaches the window layer: ZL + A, B, X,
# Y and the left stick are fullscreen, close, float, pop out and pin here as
# they are anywhere else (item 38).
#
# `match` is a substring, so "discord" also covers Canary and PTB. The forks
# are named separately because they are not: Vesktop, WebCord, Legcord.
# These are Discord's own shortcuts and they only fire while it has focus -
# the global keybinds in its own settings are a different list.

# Ahead of [profile.browser] on purpose, because the first profile that
# matches wins and Discord is often not an app at all: run as an Omarchy
# webapp its window class is `chrome-discord.com__channels_@me-Default`,
# which matches "chrome" as squarely as it matches "discord". Declared after
# the browser, none of this would ever fire on the install that needs it most.

[profile.discord]
match = ["discord", "vesktop", "webcord", "legcord", "armcord"]
# Discord opens the pad, and never to be played with: it polls the Gamepad API
# so its own keybinds can answer a controller. Left to /proc that reads as a
# game - every binding below stands aside and the sticks stop pointing - so
# the pointer died in the one window where the bindings above are a panel you
# aim at the rest of the time.
handover = false

[profile.discord.bindings]
A = { tap = "key:CTRL+SHIFT+M", desc = "Mute the microphone", hold = "key:ENTER", hold_desc = "Enter" }
B = { tap = "key:CTRL+SHIFT+D", desc = "Deafen - mic and sound", hold = "key:ESC", hold_desc = "Esc / decline a call" }
X = { tap = "key:CTRL+K", desc = "Jump to a channel" }
Y = { tap = "key:CTRL+ENTER", desc = "Answer the call" }
# The right click Y gave up. The left stick's middle click was X's twice over,
# so this is the cheapest button on the pad to spend here.
LSTICK = { tap = "click:right", desc = "Context menu" }

# YouTube, the couch's television (item 39).
#
# The menu has launched it since 35, and what it launches is a webapp window
# rather than a tab - so the pad can walk to it, and a profile can answer for
# it. A television asks a sofa for two things: whether it is playing, and
# whether it fills the screen. Both are the player's own controls, both sit
# along the bottom edge of the video behind an overlay that hides itself, and
# that is the definition of what a pointer on a sofa is worst at.
#
# X is play / pause on `k` rather than Space: Space scrolls the page whenever
# the player is not the focused element, while `k` is answered by YouTube's
# own document handler wherever the focus is, as long as it is not in a text
# box. Y is fullscreen, and that is a second Do where the pattern asks for the
# reach - rule 3 in docs/conventions/bindings.md, logged in the ledger at the
# end of it. The reach here is the search box, which cannot be used without
# the on-screen keyboard anyway, so it goes to the left stick click, and the
# button a thumb finds first carries the control every video needs.
#
# A and B are left alone, and both already say the right thing here: A is
# Enter, which opens the thumbnail the right stick walked to in game mode, and
# B is Esc, which is how a browser leaves fullscreen - "B goes back" in the
# player's own words. The D-pad costs nothing either: YouTube reads the arrows
# as seek and volume for as long as the player has the focus.
#
# What this costs, in YouTube only: the middle click (X, and the left stick
# click) and the right click (Y). Mouse button 4 on the right stick is handed
# straight back as Alt+Left, the way [profile.browser] does it and for the same
# reason - a webapp is a Chromium window, and Back is how a video is left.
#
# What did not fit: `shift+n` / `shift+p` (next / previous video), `m` (mute)
# and `c` (captions). The first is what the budget would buy next; the volume
# is already on the D-pad, and the shoulders stay the workspaces because a
# webapp has no tabs to walk.
#
# `match` is the host with its leading dash rather than the bare word: the
# class here is `chrome-www.youtube.com__-Default`, and "youtube" on its own
# would take YouTube Music (`chrome-music.youtube.com__...`) with it, where
# none of these keys exist. Declared before [profile.browser] for 35's reason:
# a webapp class matches "chrome" as squarely as it matches its own host.

[profile.youtube]
match = ["-www.youtube.com", "-youtube.com"]

[profile.youtube.bindings]
X = { tap = "key:K", desc = "Play / pause" }
Y = { tap = "key:F", desc = "Fullscreen" }
# The search box, and the reach Y gave up. `/` puts the caret in it; MINUS
# brings the keyboard, and ZR types the Enter and puts it away again.
LSTICK = { tap = "key:SLASH", desc = "Search" }
# Back, off the button that already meant it. Mouse button 4 is Back in
# Chromium too, so this only stops depending on the app honouring it.
RSTICK = { tap = "key:ALT+LEFT", desc = "Back" }

[profile.browser]
match = ["chromium", "chrome", "brave", "vivaldi"]
# The wheel back, in the browser only. Game mode hands the right stick to
# `focus` (see [mode]), which sends the keys in [traverse] - and a browser
# applies those to whatever holds the keyboard focus, not to what the pointer
# is over: the page carries on scrolling where you first clicked while the
# cursor sits somewhere else entirely. Every other app moves its focus ring
# where you can see it, so this is the browser's exception rather than a
# change of mind about the stick. A profile may name either stick; empty, or
# absent, leaves the layer's own role alone.
right_stick = "scroll"

[profile.browser.bindings]
L = { tap = "key:CTRL+SHIFT+TAB", desc = "Previous tab", hold = "hypr:hl.dsp.focus({ workspace = 'r-1' })", hold_desc = "Previous workspace", confirm = true }
R = { tap = "key:CTRL+TAB", desc = "Next tab", hold = "hypr:hl.dsp.focus({ workspace = 'r+1' })", hold_desc = "Next workspace", confirm = true }

# The rest of the browser. Four jobs and three spare buttons, so the two that
# belong to the page share one: a new tab is what you reach for, reloading is
# not, and both are about the tab in front of you.
#
# What these cost, in the browser only: X and the left stick click were the
# middle click (twice over), and the right stick click was mouse button 4,
# which browsers already read as Back - so it keeps its direction and only
# stops depending on the app honouring that button.
X = { tap = "key:CTRL+T", desc = "New tab", short = "Tab", hold = "key:F5", hold_desc = "Reload", hold_ms = 500 }
RSTICK = { tap = "key:ALT+LEFT", desc = "Back" }
LSTICK = { tap = "key:ALT+RIGHT", desc = "Forward" }

# The file manager, where B is the button the whole app is walked with.
#
# B is Esc everywhere else, which a file manager does nothing with: browsing is
# a walk into folders and back out of them, and the way back out is the one key
# a pad has no button for. So here it goes up one directory - the same
# direction B already means in the menu and the keyboard, applied to the tree
# the app in front is showing.
#
# Alt+Up is the shortcut every desktop file manager agrees on (Nautilus,
# Thunar, Nemo, Dolphin, PCManFM alike), so one binding covers `match`.

[profile.files]
match = ["nautilus", "thunar", "nemo", "dolphin", "pcmanfm"]

[profile.files.bindings]
B = { tap = "key:ALT+UP", desc = "Up one directory" }

# The terminal, where what a shell is driven with is exactly what the pad has
# no button for (item 37).
#
# Every key here is the *shell's* own rather than an emulator's, so one profile
# covers all five names in `match`: foot and alacritty have neither tabs nor a
# context menu, and a scheme built on those would be dead in two of the five.
#
# `right_stick`, and why this profile needs one at all: game mode hands the
# right stick to `focus` (see [mode]), which sends the keys in [traverse] - and
# at a prompt those are the worst keys on the keyboard. `next` is Tab, so the
# stick completes; `up` and `down` walk the shell's history, so it rewrites the
# line you were reading. Meanwhile a terminal answers the wheel with its
# scrollback, which is the thing the stick is being pushed for. Same exception
# the browser makes, for the opposite reason: there the focus keys go somewhere
# real but not where the pointer is, here they go somewhere actively wrong.
[profile.shell]
match = ["foot", "alacritty", "ghostty", "kitty", "wezterm"]
right_stick = "scroll"

[profile.shell.bindings]
# Backspace, and why it is a button here while Tab is not.
#
# What a command typed from the sofa needs most is the letter back: it is
# aimed at with a thumbstick, and the letter aimed at is regularly not the one
# that lands. Tab held this button first and was the wrong shape for it -
# completing meant putting the keyboard away, pressing a button and summoning
# it again, once per completion. It costs nothing to give up, because the
# keyboard has always had a Tab key of its own on the first page: with the
# line still in front of you, it is aimed at like any other key.
#
# X rather than Y, and that is the whole of the pattern in
# `docs/conventions/bindings.md`: X is the app's own verb, and erasing what
# you have typed is a terminal's. It is also where the *keyboard* layer has
# put Backspace since it was drawn, so the key does not move under your thumb
# when the on-screen keyboard opens over the prompt and closes again - which
# is exactly the pair of surfaces a command is typed across. It costs the
# terminal nothing else: `ZL` + X is still float / tile (item 38).
#
# Written plain rather than as a tap/hold on purpose: a tap/hold binding waits
# for the release before the key goes down (`waits_for_release`), and that
# costs the autorepeat. Backspace is the one key that is held rather than
# pressed, which is also why Ctrl+C rides Y below and not this button.
X = "key:BACKSPACE"

# The middle click X used to carry at the base layer pastes the PRIMARY
# selection, which wants a selection made with a mouse and a pointer parked on
# the prompt - from the couch, the deadest button in a terminal. Ctrl+Shift+V
# pastes the clipboard the rest of the desktop actually fills.
#
# On Y because Backspace took X, and Y is the cheaper of the two to spend
# here: it is the right click, which in a terminal opens a menu of two entries
# in kitty and ghostty and nothing at all in foot and alacritty.
#
# Ctrl+C rides this hold rather than B's. When it was written, a profile
# reached into the window layer too, and B would have taken `ZL` + B - closing
# the window - away from every terminal; item 38 ended that, and this stays
# where it is because a hold is the right shape for an interrupt: killing a
# command by accident is worse than pasting one by accident, and B is Esc,
# which vim and less want more than the shell wants a second way to interrupt.
Y = { tap = "key:CTRL+SHIFT+V", desc = "Paste", hold = "key:CTRL+C", hold_desc = "Interrupt" }

# The cheapest click left in a terminal - the same displacement
# [profile.browser] and [profile.discord] make, and it costs the window pin
# nothing: `ZL` + left stick still pins. Ctrl+L is what you press when the
# screen has scrolled past reading.
LSTICK = { tap = "key:CTRL+L", desc = "Clear the screen" }

# Copy, and the last cheap button a terminal has: R3 is `click:back` at the
# base layer, and no terminal answers a back click at all.
#
# Ctrl+Shift+C rather than Ctrl+C because a terminal's copy is the shifted one
# in all five names in `match` - and because the unshifted one is already the
# interrupt on Y's hold, where a hold is the only safe shape for it.
#
# It is what makes the paste above a round trip. Selecting is the one half of
# this that a pointer on a sofa still does well: ZR drags a selection the way a
# mouse would, and until now that selection could only be put back with the
# middle click this profile spent. Now it reaches the clipboard the rest of the
# desktop fills, which is the one Y pastes from.
RSTICK = { tap = "key:CTRL+SHIFT+C", desc = "Copy" }

# Left alone on purpose. B stays Esc, which vim, less and every full-screen
# program in a terminal want; A is Enter, ZR is the left click, and the D-pad
# is the arrows the line editor and the history are walked with.
#
# What the four overrides above spend: X and the left stick were the pad's two
# middle clicks, so a terminal now has none, and text selected with a mouse but
# never copied is unreachable from the pad - which is what R3 gives back, on
# the clipboard rather than in PRIMARY. Y was the right click, the one this
# profile is happiest to lose, and R3 was the back click, which a terminal
# never had a use for.

# ---------------------------------------------------------------------------
# A keyboard page of the app's own (item 27).
#
# Typing a command letter by letter with a thumbstick is the worst thing the
# on-screen keyboard asks anybody to do, and in a terminal it is also the most
# predictable: the command you want is nearly always one you have run before.
# So a profile can lend the keyboard a page. It joins the cycle L/R already
# walk - abc, &123, Fn, and then this one - for as long as that window is in
# front, and leaves with it. An entry types its whole string, which leaves ZR
# (Enter, and the keyboard away) to run it.
#
# Entries come from two places, both optional and `keys` drawn first:
#
#   keys   commands worth having in front of you, written down here
#   from   a shell command whose output is one entry per line - which is how
#          the commands you actually ran get onto the keyboard without omapad
#          knowing anything about anybody's shell
#
# A written-down entry is a plain string, or a table that names it:
#
#   { label = "Update", text = "sudo pacman -Syu" }
#
# and a table with `action` instead of `text` sends a **chord** rather than
# typing a string, written the way [osk.keys] writes one. That is what a key
# which is wrong in exactly one app needs: the bottom row's Paste is Ctrl+V,
# right everywhere except here, and the terminal's own paste goes on this page.
#
# `limit` caps the two together, `ttl` is how long the command's output is
# reused before it is run again, and the page holds four rows: a short entry
# shares a row, a long one takes it alone, and the rest do not fit.
#
# **bash only writes its history file when the shell exits**, so what the
# terminal in front has typed today is not in it yet. One line in ~/.bashrc
# appends every command as it is run:
#
#   PROMPT_COMMAND='history -a'
#
# Another shell or history tool changes only the command:
#
#   from = "atuin history list --reverse --format '{command}' | head -8"

[profile.shell.osk]
label = "Term"
keys = [
  { label = "Paste", action = "CTRL+SHIFT+V" },
  "git status",
  "sudo pacman -Syu",
]
# Newest first and each command once. What is thrown away is what a page read
# from the sofa cannot use: `#`-prefixed timestamp lines (bash writes those
# when HISTTIMEFORMAT is set), the one- and two-character typos, and anything
# too long to read on a key.
from = "tac ~/.bash_history | awk '!/^#/ && length > 2 && length < 60 && !seen[$0]++' | head -8"
ttl = 10
limit = 8

# The browser's page, over the same mechanism (item 32).
#
# A URL is the one string on this desktop that has to be typed exactly, and it
# is the thing a thumbstick is worst at, so the page is built around the
# address bar rather than around the browser's menus. `Address bar` puts the
# caret where you are about to type without aiming at it; `https://` is the
# prefix the omnibox will not guess for you once what follows is not a plain
# domain; and `Go .com` wraps what you have typed in www./.com and opens it,
# which turns a domain into the few letters in the middle of it.
#
# The four after those are what the pad has no button left for and what the
# keyboard is open for anyway: finding in the page and searching the open tabs
# are both typed at, reopening a tab is the one-key undo of a mis-click, and
# zoom is the couch's own complaint - a page written for a desk, read from a
# sofa. Zoom is two entries because it is pressed more than once.
#
# These are Chromium's shortcuts, which is what `match` above names. Firefox
# reads Ctrl+Shift+A as its add-on manager rather than tab search, so a Firefox
# profile wants a page of its own.
#
# Four rows is the whole page, so eight short entries is all of it. What did
# not fit, in case you would rather have it than one of these: bookmark this
# page (CTRL+D), history (CTRL+H), downloads (CTRL+J), close the tab (CTRL+W),
# full screen (F11), reset the zoom (CTRL+0), a private window
# (CTRL+SHIFT+N).

[profile.browser.osk]
label = "Web"
keys = [
  { label = "Address bar", action = "CTRL+L" },
  "https://",
  { label = "Go .com", action = "CTRL+ENTER" },
  { label = "Find", action = "CTRL+F" },
  { label = "Search tabs", action = "CTRL+SHIFT+A" },
  { label = "Reopen tab", action = "CTRL+SHIFT+T" },
  { label = "Zoom −", action = "CTRL+MINUS" },
  { label = "Zoom +", action = "CTRL+EQUAL" },
]

# Discord's page, over the same mechanism.
#
# A chat app is typed at, which is the one thing a thumbstick cannot do
# quickly - so half of this page is the sentences you send without meaning
# anything by them. "brb", "omw" and "gg" are three keys instead of nine
# aimed letters, and they are what most of a couch conversation actually is.
#
# The other half is the pickers, because each of them opens something that is
# then typed into or walked with the D-pad: the emoji and GIF pickers are
# searched by name, Ctrl+F searches the messages, and Shift+Esc marks the
# whole server read - the one-key answer to coming back to a wall of bold
# channels. The quick switcher is not here; it is on X, where it does not
# cost a page turn.
#
# Four rows is the whole page, so eight short entries is all of it. What did
# not fit: the sticker picker (CTRL+S), the inbox (CTRL+I), uploading a file
# (CTRL+SHIFT+U), editing the message you last sent (UP, which the D-pad
# already sends), and the previous / next unread channel (ALT+SHIFT+UP /
# ALT+SHIFT+DOWN).

[profile.discord.osk]
label = "Chat"
keys = [
  "brb",
  "omw",
  "gg",
  { label = "Search", action = "CTRL+F" },
  { label = "Emoji", action = "CTRL+E" },
  { label = "GIF", action = "CTRL+G" },
  { label = "Mark read", action = "SHIFT+ESC" },
  { label = "Pins", action = "CTRL+P" },
]

# ---------------------------------------------------------------------------
# Couch layer - what game mode changes about the desktop, and nothing more.
#
# Empty by default, and usually that is right: game mode is the desktop from
# the sofa, so every binding, layer and profile works there exactly as it does
# anywhere else. A button this does not name keeps doing what the base layer
# says. Name one only where the couch wants something different:
#
#   [bindings.game]
#   Y = "exec:steam steam://open/bigpicture"
#
# Fill it in and the guide grows a page for what it changed.

[bindings.game]
# Empty on purpose: game mode is the desktop read from further away, so every
# base binding still means what it meant. Name a button above only where the
# couch wants something different.

# Steam takes the pad for itself - it reads controllers through hidraw, so
# omapad notices and lets go - which leaves no way back to the desktop from
# inside Big Picture or a game. This is that way: hold a shoulder, it ticks and
# says what is coming, keep holding while the badge fills the rest of the way
# and the workspace changes. Let go or press the cancel button and nothing
# happens. Both waits are [confirm]'s, so they are changed in one place.
#
# An announced, counted-down hold is the only thing besides a summon that
# reaches past an app holding the pad, and deliberately so: Steam sees that
# button too, so anything shorter would fire while you were playing.
#
# `match` is a substring, so this covers the client, Big Picture and the games
# it launches (`steam_app_...`) alike.

[profile.steam]
match = ["steam"]

[profile.steam.bindings]
L = { hold = "hypr:hl.dsp.focus({ workspace = 'r-1' })", hold_desc = "Previous workspace", confirm = true }
R = { hold = "hypr:hl.dsp.focus({ workspace = 'r+1' })", hold_desc = "Next workspace", confirm = true }

# Cloud gaming and remote play: the same shape as Steam, for the same reason.
# These open the pad the moment a session starts - measured with GeForce NOW,
# which held /dev/input/event17 and js0 while Fortnite was on screen - so
# omapad lets go and every plain binding stands aside. That is right: the
# game is being played, and a button of ours firing on top of it is a button
# taken away from the game.
#
# What is left is the two gestures a game does not ask for. The shoulders held
# and confirmed walk the workspaces, which is the one thing worth doing without
# leaving the stream; everything else - the keyboard, the window ops, game mode
# - is a row in the menu, and the menu is the MINUS+PLUS chord.
#
# The classes are the applications' own: GeForce NOW's window class is plainly
# `GeForceNOW`, and a session run in a browser instead matches
# [profile.browser], which puts the same confirmed hold on the same two
# buttons. Moonlight and Chiaki are the self-hosted end of the same thing.

[profile.cloud]
match = ["geforcenow", "moonlight", "chiaki", "xcloud", "greenlight"]

[profile.cloud.bindings]
L = { hold = "hypr:hl.dsp.focus({ workspace = 'r-1' })", hold_desc = "Previous workspace", confirm = true }
R = { hold = "hypr:hl.dsp.focus({ workspace = 'r+1' })", hold_desc = "Next workspace", confirm = true }

# ---------------------------------------------------------------------------
# Guide layer - active whenever the bindings guide is up.
#
# Implicit like the other two, and it outranks both: the guide is the thing
# being read, so it owns the pad while it is up. It has one job - turn the
# page - and every other button is a way out, because the guide is where you
# go when you have forgotten which button does what.
#
# Whatever is bound here prints along the bottom of the guide itself, on every
# page, so it stays honest if you change it.
# ---------------------------------------------------------------------------

[bindings.guide]
L = "guide:prev"
R = "guide:next"
DPAD_LEFT = "guide:prev"
DPAD_RIGHT = "guide:next"

A = "guide:close"
B = "guide:close"
X = "guide:close"
Y = "guide:close"

MINUS = "guide:close"
PLUS = "guide:close"
RSTICK = "guide:close"
CAPTURE = "guide:close"
HOME = { tap = "guide:close", hold = "mode:toggle", hold_ms = 700, on_press = true }

# ---------------------------------------------------------------------------
# The quick menu - one row of tiles, what PLUS opens.
#
# The controller menu is a place, and HOME is its door. This is what a pause
# button is for instead: five or six things somebody stops a game to do, in
# one row the D-pad walks end to end, with a band under it saying what the
# tile in front is on and what A does. Drawn after `Console Overlay` in the
# Console OS v2 mockups.
#
# A tile takes the binding grammar, so it reaches anything a button can:
#   label    required, three words at most
#   icon     a glyph the shell's font has (`icon_font` where it is not)
#   detail   the line in the band, about 40 characters, saying what A does
#   action   what A runs. The quick menu closes first and the action runs
#            after, so what it opens is not left behind the dimming; `stay`
#            keeps it up instead, for what the row itself prints
#   up/down  what the D-pad's up and down do on this tile - a value it nudges.
#            Both or neither. A `live:` number draws its bar in the band
#   arm      A has to be pressed twice. The first press says so in the band,
#            and anything else - a step, B - lets go of it. For what nobody
#            can take back
#   danger   drawn in the theme's urgent colour
#   id       what `omapad ctl quick select` and the payload call it; a slug
#            of the label unless said
#
# The first tile is the one it opens on, every time: this is a pause, and the
# first thing it offers is to stop pausing - PLUS then A is always back.
# ---------------------------------------------------------------------------

[quick]
# socket = "/run/user/1000/omapad/quick.sock"

[[quick.items]]
icon = "󰐊"
label = "Resume"
detail = "Close this and carry on"
action = "quick:close"

[[quick.items]]
icon = "󰕾"
label = "Volume"
detail = "Up and down turn it"
up = "live:volume=up"
down = "live:volume=down"

# Left off the row on a machine that cannot say how bright it is - a desktop
# monitor with no DDC, a machine with no backlight - since a tile turning a
# number nobody can read changes nothing on screen. Any tile whose `up` is a
# `live:` reading waits for that reading's first answer the same way.
[[quick.items]]
icon = "󰃠"
label = "Brightness"
detail = "Up and down turn it"
up = "live:brightness=up"
down = "live:brightness=down"

[[quick.items]]
icon = "󰄀"
label = "Screenshot"
detail = "Save what is on screen"
action = "exec:omarchy-capture-screenshot"

# The whole screen and what it plays, since the picker Omarchy draws for a
# region is aimed with a mouse. The same press stops it: the helper stops a
# recording that is running rather than starting a second. An `exec:` and not
# a `live:` switch, although it is one, because a live write runs inside the
# daemon's own service and a daemon restart would end the recording with it.
[[quick.items]]
icon = "󰑋"
label = "Record"
detail = "Start or stop recording the screen"
action = "exec:omarchy-capture-screenrecording --fullscreen --with-desktop-audio"

[[quick.items]]
icon = "󰌌"
label = "Keyboard"
detail = "Type into what is in front"
action = "osk:open"

[[quick.items]]
icon = "󰍜"
label = "Menu"
detail = "Everything else"
action = "menu:open"

# Last, drawn in the urgent colour, and pressed twice: whatever was unsaved in
# the window goes with it.
[[quick.items]]
icon = "󰅖"
label = "Close window"
detail = "Close what is in front"
action = "hypr:hl.dsp.window.close()"
arm = true
danger = true

# ---------------------------------------------------------------------------
# The controller menu - one column of rows, the way the Omarchy menu is shaped.
#
# A radial reads a stick angle in one flick, but it caps out at a handful of
# entries and has nowhere to put a submenu; a list is what a D-pad walks well
# and what the desktop already teaches.
#
# Every row takes an `action` from the same grammar as a button binding, or an
# `items` list to open a submenu. `icon` is any glyph the shell's font has -
# these are the Nerd Font icons the Omarchy menu itself uses. `detail` prints a
# quieter second line under the label.
#
# `repeat = true` marks a row you nudge rather than pick: the menu stays where
# it is and holding the button keeps firing, the way a held volume key does.
# Nothing shipped uses it any more - the volume and brightness rows that did
# are bars now, and a bar is held rather than repeated - but it is still the
# right answer for a step that has no value to show.
# `stay = true` is the quieter half of that - one press, and the menu stays up:
# what a row that changes a setting the menu itself prints needs, so trying two
# badge layouts costs two presses rather than two trips back here. Every other
# row closes the menu the moment it is picked.
#
# A row whose action sets something is ticked while that something is what is
# in force, so a list of choices says which one you are on.
#
# The root is kept short and grouped, because a list that runs past the fold is
# one you scroll rather than read: what you open, then what is on screen, then
# the room, then the pad, then the machine - and last, on its own, the way out
# into the Omarchy menu. A row that is not reached often lives inside the group
# it belongs to rather than at the top level.
#
# Overriding `items` in your own config replaces the whole tree rather than
# merging row by row, which is what you want: your menu is your menu.
# ---------------------------------------------------------------------------

[menu]
title = "Go"                  # the word at the head of the card
# The day and the time used to sit on the title line; the head grid above the
# bar is where they belong now, so this is empty. A config that still sets it
# gets its clock back on the title line as well.
clock = ""
# How many cells across a page is. A cell is a fixed square (`cell` below), so
# this is the page's own width and not a way of dividing up the screen: raise
# it for a wider page and the card grows with it until the screen runs out,
# after which the page scrolls sideways to whatever the selection is on.
# Below three there is nowhere to put a bar; far above it every page is a page
# you have to walk across.
columns = 12
# One cell, square, in unscaled pixels - the module the whole page is built
# from. A tile is a number of these across and down, the nav cards on the bar
# are one each, and the gap between them is an eighth of this.
#
# **It does not stretch.** A cell used to be this tall and whatever `columns`
# left of the card wide, which made the shape of a tile a property of the
# monitor it landed on - on a television that is a cell six times wider than
# it is tall, and a tile that shape cannot stand an icon over a label, so
# every tile came out a word on a strip. A module is a module at any width,
# and what does not fit scrolls.
#
# The arithmetic is worth keeping when either half of it changes:
# `columns * cell * scale + (columns - 1) * 16 * scale` has to clear the
# screen less twice the inline padding, or the card is cut to the whole
# columns that do fit and the rest are only reachable by walking to them.
#
# **And the screen in that sum is the logical one**, which is the half of it
# that is easy to get wrong: 128 came from twelve cells and sixteen-pixel
# gaps filling 1920 exactly, and a 1920 panel at a compositor scale of 1.25
# is 1536 wide to a surface, not 1920. `fullscreen` above keeps 90 clear at
# each edge, so what a page has there is 1356 and twelve of 128 come to
# 1712: the card is cut to the whole columns that fit and the rest are only
# reachable by walking to them.
#
# The sum to do it with: take the panel's width, divide by the compositor's
# scale, take off twice the fullscreen margin (90 a side, or `[ui] safe_area`
# of the width where that is larger), and pick the cell that leaves
# `columns` of them and their gaps inside what is left. Raise it and a tile
# reads from further away and fewer fit; lower it for a denser page - but
# not far: a nav card is one cell and it holds a name over the line saying
# what that place is doing, and under about a hundred the line is dropped
# and the name is elided. Unscaled: `[ui] scale` and `game_scale` multiply
# it like every other measurement on the surface.
cell = 128
# What a tile off to the side costs against one straight ahead, both measured
# edge to edge - the same question `[snap] bias` answers about windows, and its
# own number because tiles are small and touching where windows are large and
# sparse. Below 1 the nearest tile wins whatever direction was pressed, which
# makes the press meaningless; far above it only a tile perfectly in line is
# ever reachable. It decides between the tiles that way, never whether one is:
# a press walks the band it pushes along - the rows a sideways one covers, the
# columns an up or down one does - so a tile that is not beside this one is
# not what any number here reaches.
bias = 2.0
repeat_delay_ms = 400         # hold a direction this long before it walks
repeat_rate_ms = 110          # then one tile every this many ms
# And how much faster it walks the longer it is held. A page is twelve cells
# across and a thumb crossing one is covering a distance rather than picking
# the tile next door, so the steps close up: `repeat_ramp` times the rate
# above once the direction has been held for `repeat_ramp_ms`, and no faster
# after that. 1.0 turns it off and every step is `repeat_rate_ms`.
#
# The same shape as `ramp` below, and deliberately its own numbers: that one
# crosses a control's range, where the distance is 38 steps of a speed, and
# this one crosses a page. A reversal starts the ramp again, because somebody
# pushing the other way has gone too far.
repeat_ramp = 2.5
repeat_ramp_ms = 1000
# How long the bar has to stop moving before the chip you came to rest on is
# worth asking about. Flicking across five groups in a second should spawn one
# command, not five: the four you passed through are answers nobody wanted.
# Raise it if a fast walk still spawns commands; lower it and a group you
# meant to stop on fills later.
group_settle_ms = 180
# Whether the card prints what its face buttons do along the foot. In game
# mode omapad's own bar is already along an edge saying the same thing, and
# somebody running that may not want it said twice - but the two are not the
# same answer in general: the bar is the screen's and this is the page's, and
# only this one can say what a page has spent a key on.
keys = true

# Whether the menu still has a first start to answer for. While it is true the
# `Start here` tile is on the first page and the menu opens on it; the daemon
# writes it false to settings.toml the first time the menu is opened, so the
# tile is shown once and then goes.
#
# A mark rather than a preference, and the reason it is a setting at all is
# that settings.toml is where the pad writes things down. Delete the line from
# that file - the header there says so - and the tile comes back, which is the
# only way anyone would ever want it again.
first_run = true

# A control with a range - a slider - is walked with the D-pad once A has
# taken it, and swept with either trigger whether or not it has been taken.
# The two exist for different presses: the D-pad is how you land on the number
# you meant, and a trigger is how you cross the distance to it.
#
# `ramp` is what a held direction grows to: the shipped pointer speed is 38
# steps end to end, and a slider that stepped once per repeat would be worse
# than the two rows it replaced. Raise it to cross a range in fewer presses,
# lower it towards 1.0 to step evenly however long it is held. Pushing the
# other way resets it - a reversal is somebody who went too far.
ramp = 4.0
ramp_ms = 900                 # how long holding it takes to reach `ramp`
# And how long a fully pulled trigger takes to cross a control's whole range.
# Half pulled takes twice as long, so this is the fastest it ever moves rather
# than the only speed it has. Raise it for finer aim, lower it to cross a
# range in one pull.
sweep_ms = 1500
# And the third way in, which only a knob has: the stick's own angle. A slider
# is pushed and a knob is turned, so on a knob the left stick stops walking
# the page and carries the ring round instead - relative, so the value follows
# how far the thumb has travelled rather than where it is pointing, and
# nothing jumps the moment the stick is touched.
#
# Which of the two gestures it is, and they are genuinely different controls.
#
#   aim    where the thumb points is where the value goes. The pointer on the
#          screen and the stick in your hand are the same figure, so a knob is
#          one push: take it, point at the number, let go. The quarter the
#          scale leaves open at the bottom is its two end stops - point into
#          it left of centre for the bottom of the range and right of centre
#          for the top - so a ring still does not come round at the ends.
#   carry  the value moves by how far your thumb has travelled since the last
#          frame, never by where it is pointing. Nothing can jump on the frame
#          you touch the stick, which is what this is for: grabbing an aimed
#          dial at two o'clock puts the volume at two o'clock, and on a sink
#          that is a loud press made by not looking. Winding, in exchange.
#
# `turn_degrees` and `turn_step_degrees` are `carry`'s gearing and do nothing
# under `aim`, which has no gearing to have - the scale is the whole of it.
turn = "aim"

# `turn_degrees` is the gearing: how far round a thumb has to carry it to
# cross the whole range. A quarter turn is twitchy on a volume and right on a
# list of four; raise it for finer aim, lower it to cross a range in one
# sweep of the thumb.
turn_degrees = 270
# And the floor under one step of that: the gearing above is of the whole
# range, and a thumb aims at a *step*. How many steps a knob has is the
# control's business, not the dial's - a pair of words is one step end to end
# and the pointer's speed is thirty-eight - so at 270 for the range the same
# turn is a quarter of a circle per step on the first and seven degrees on the
# last. Seven degrees is not an aim, it is a wobble; volume sat at 13.5 and a
# thumb crossing the rim moved a third of the range it was passing over.
#
# So the two are read together and the slower wins: the range still crosses in
# `turn_degrees` unless that would put two steps closer together than this, at
# which point the step is this and the range takes as long as it takes. 30 is
# about a dozen detents to the turn, which is where a clicking knob puts them.
# Lower it for a faster dial you have to aim at; raise it for one you can stop
# on without looking, at the cost of more turning.
turn_step_degrees = 30
# And how far over the stick has to be before any of that bites. Near the
# middle of a stick's travel an angle is noise - a resting thumb crosses whole
# quadrants without moving - so below this nothing turns, and coming back over
# it starts from wherever the thumb landed. Raise it if a resting hand still
# moves a value, lower it to turn without pushing the stick so far.
turn_grip = 0.5

# And the same for `aim`, which is lower on purpose. The two gestures are not
# asking the stick for the same thing: `carry` adds up how far your thumb has
# travelled, so a wobble near the middle accumulates into real movement and
# the radius has to be big enough to keep that sum honest. `aim` reads where
# you are pointing and keeps nothing, so a wobble is an error that corrects
# itself the moment your thumb moves on - it only needs enough radius for the
# bearing to mean something.
#
# Half the travel, inherited from `carry`, was a wall: measured on a pad, a
# thumb turning a dial the way a hand turns one reaches about 0.45 of the
# stick and stays there, so the ring did nothing at all until it was shoved
# past half - which reads as a control that answers late rather than one that
# is waiting. Raise it if a dial moves when you did not mean to touch it;
# lower it for a ring that answers a smaller push.
aim_grip = 0.25

# And when a stick has stopped being a hand. A stick you let go of does not
# come straight back to the middle: its two axes return at their own rates, so
# the bearing swings on the way in - measured on a pad, a ring let go of at 18
# degrees read 27 and then 38 over the two frames it took to fall past the
# grip, and pulled the volume four percent up behind it. The value ended where
# the spring passed rather than where you were pointing, which is the one
# thing a control you aim at must not do.
#
# So the spring is told from the thumb by how fast the stick is falling
# inward, in stick travel a second. Turning, it moves about a thousandth of
# the travel a frame; released, it crosses a quarter of it - this sits between
# two numbers two orders of magnitude apart, and the reading stops the moment
# it is crossed until you push back out. Both gestures use it; `carry` winds
# on that same swing, more quietly.
#
# Lower it if a dial still creeps as you let go; raise it if pulling the stick
# back towards the middle while you turn stops the ring answering.
turn_return = 4.0

# What the sticks do while the menu is up. Every other surface keeps whatever
# the base layer's sticks were doing - the pointer still works under the
# keyboard - and this one does not, because it is the one with something for a
# thumb to do. The left stick walks the tiles, held rather than flicked, at
# the same rate `[traverse]` walks a window's own controls. The right stick
# keeps the pointer, so the promise that the pointer stays live under the open
# card is kept by the thumb that was aiming with it anyway.
left_stick = "menu"
right_stick = "cursor"

# How often a gauge is told where the thumb is, while a gauge is the tile in
# front. Nothing else on this surface streams anything: the *tile's* kind
# decides, not the surface's, so a menu open on a page of buttons costs the
# loop nothing at all. It cannot be more than `[pointer] poll_hz`, which is
# how many turns the loop takes in a second - `omapad check` says so.
live_hz = 60

# Whether the card fills the screen, drawing no panel of its own - just the
# tiles over the dimmed desktop. A card reads as a menu and a whole screen
# reads as a page, which is the difference between "I am picking a thing" and
# "I am in the panel"; across a room the second one is what a HUD is for.
# `false` gives back the centred card, which is the better shape at a desk.
fullscreen = true

# How dark the screen behind the menu goes, on top of whatever the theme's own
# scrim already does. With the compositor blurring behind us as well this is
# the tint over the blur; with blur off it is the whole of what stands between
# a tile's label and a window full of text. Raise it if the desktop shows
# through too much, lower it to see more of what is behind.
dim = 0.6

# How much of a tile's corner is drawing rather than edge, in unscaled pixels,
# where the compositor has no answer of its own. Each state of a tile is drawn
# on its own outline - a plain tile is rounded, a selected one is cut back, a
# tile being carried has a bite out of it - and this is how far into the tile
# that corner reaches. Raise it and the state a tile is in reads from across a
# room; lower it towards 0 and every tile is the same square, which is a page
# that says which tile is selected in colour alone.
#
# **The compositor is asked first.** `decoration:rounding` is this desktop's
# own answer to how hard a corner is rounded, and everything the menu draws
# inside its card steps down from it - so a desktop that rounds windows at 12
# gets tiles at 12 without being told twice. This is the answer where it
# rounds nothing, which Omarchy ships as: that is the compositor saying so
# about *windows*, and a tile is not a window - a selection that vanished at 0
# is the one thing this must not do.
tile_corner = 23

# How solid a tile's ground is drawn, where nothing about the tile says
# otherwise. 1.0 is the opaque card this surface was drawn to; lower it and
# the page opens up - what comes through is the scrim, and under that whatever
# the compositor is blurring behind the whole surface. At 0 a plain tile has
# no ground at all and the page is its ink and its edges.
#
# **It is the fill, not the tile.** A label and an icon are drawn at full
# strength whatever this says: a page you can see through is not the same
# thing as a page you cannot read.
#
# **And the tile under the thumb is always the whole of it.** Whatever this
# is, a selected tile is drawn solid - so lowering it is also how far the
# page falls back behind the thing you are on, and the selection comes
# forward as you walk rather than only being ringed. At 1.0 there is nothing
# to come forward from, which is why the shipped page looks exactly as it did.
#
# Two other grounds ignore it, because each of them *is* a state rather than
# the absence of one: a switch that is on stays filled, and a tile held in the
# hand keeps its own tint.
#
# **`dim` above does the work this gives up.** What a label stands on once the
# fill is low is the scrim, so a page that reads badly over a window full of
# text is asking for a darker `dim` rather than a higher fill. With `[ui] blur`
# on there is a blur under that as well, and the two together are what make a
# low fill legible at all.
tile_fill = 1.0
# How long a tile stays lit after A lands on it, in milliseconds. A press is
# the one thing this surface does that has no state to show afterwards: the
# thumb is on a button that feels the same whatever it did, and a tile that
# ran its action looks exactly like a tile that was not reached - the argument
# `[cursor] ripple` answers for a click. Raise it if a press goes by unseen,
# lower it towards 0 to turn the flash off and leave the press silent.
press_ms = 160

# How long a row that says `countdown = true` counts before it runs, in
# seconds. It is the other answer to *are you sure*, and the two are for
# different presses: a **hold** is right where the gesture is already in the
# hand and is over in a second, and a **countdown** is right where what
# happens next takes the screen away. Logging out is not a press to be sure
# about for 900 ms; it is one to be given long enough to change your mind
# about, and holding A for ten seconds is not a gesture anybody makes.
#
# Raise it if ten seconds is not long enough to find B from where you sit.
# `[confirm] scale` deliberately does not reach it - that setting is for a
# hand that cannot keep a button down, and this asks nobody to keep anything
# down.
countdown = 10

# A tile can list its own page instead of holding one: `from` is a command, and
# every line it prints becomes a tile (see the audio outputs below). The
# command runs when the page is entered, off to one side: the page opens at
# once and the tiles appear when the answer does. This is how long that answer
# may take before the page is called empty. Raise it for a listing that is
# slow; lower it and a slow one settles on empty sooner.
list_timeout_ms = 1000
list_limit = 24               # and how many of its lines reach the page
# socket = "/run/user/1000/omapad/menu.sock"   # defaults to $XDG_RUNTIME_DIR

# ---------------------------------------------------------------------------
# The head: the read-only grid above the bar.
#
# Nothing here is selectable. A clock is not a button, and a cursor that can
# wander into one is a cursor that has to come back out again.
#
# A cell is up to three lines and every one of them is the same kind of thing:
# a time it renders itself (`format`, strftime) or the last thing a command
# said (`from`). `over` sits above the cell's own line and `under` below it,
# both set small and in capitals; the middle one is the headline, and it is
# what the cell's height is spent on.
#
# A line written as a bare string is a `format`, which is the common case -
# `under = "%A"` is the whole of what a weekday costs. A table is the long
# form, and it is how a line becomes a command instead:
#
#     over = { from = "id -un", ttl = 0 }
#
# Three lines in one cell rather than three cells, because the head is packed
# first fit: nothing can promise that the cell holding the day lands under the
# one holding the time rather than beside it.
#
# `ttl` is how long an answer stays fresh, which is not the same clock as the
# redraw: the card repaints every couple of seconds, the weather is asked for
# every quarter of an hour, and a name is asked for once.
#
# A cell given more than one row prints its first line as a headline; a cell
# one row tall prints a line of text. Which is why the clock is three rows tall:
# the time is the one thing on this surface meant to be read from the far side
# of the room, so it is set at the top of the scale, and a name over it and a
# weekday under it need the rest of the height. A cell with fewer rows than its
# lines need clips rather than shrinking - the height is what you turn the
# clock down with.
#
# The weather is the whole reason this is a command rather than a feature.
# omapad owns no network, no location and no cache: `omarchy-weather-status`
# does the reading, `omarchy-weather-icon` does the condition - the same glyph
# Omarchy's own bar draws, and it knows whether the sun is up -
# `omarchy-weather-location` decides where, and each prints its own failure.
# Point this at something else and the cell says something else.
#
# What the `sed` does is wording, which is omapad's business. The place goes
# (you know where you are), the word `Temp` becomes the condition glyph, and
# `Wind` goes because the arrow after it already says so:
#
#     Istanbul  ·  Temp 20°C  ·  Wind ↓15km/h      →        20°C  ·  ↓15km/h
#
# The two helpers are a pipeline rather than one after the other so their two
# network calls overlap - half a second instead of most of a second, against
# a `list_timeout_ms` that has to cover both. A failure has no place, no
# `Temp` and no `Wind` in it, so the sentence the helper wrote passes straight
# through.
# ---------------------------------------------------------------------------

# The head is a **strip**: one row across the top, read before anything is
# chosen. The first line a cell has is the one it says loudly and the rest run
# along beside it as facts, so a cell with a name over it says the name and
# murmurs the weather, and a cell with only a time says the time. A cell that
# reaches the last column hangs off the right edge - the grid's last column,
# not the card's.
#
# The shipped strip is a name and a time and nothing else. The weather and the
# weekday were both on it, and a head that murmurs three facts before the page
# has said anything is a status bar, which game mode took away on purpose. The
# weather cell is the example above for anyone who wants it back:
#
#     from = """omarchy-weather-status | { i=$(omarchy-weather-icon); sed "s|^[^·]*·  ||; s|Temp |$i  |; s|Wind ||"; }"""
#     ttl = 900
#
# and `under = "%A"` on the clock is the day.

# Who this is.
[[menu.head]]
span = [8, 1]
from = "id -un"
ttl = 0

# And the time, at the far end. Game mode takes Omarchy's bar away and the pad
# can reach no other clock, so this is the one the room has.
[[menu.head]]
span = [4, 1]
format = "%H:%M"

# ---------------------------------------------------------------------------
# The bar, and the tiles under it.
#
# A top-level row is a **group**: a chip on the bar, walked with the shoulders.
# The bar holds places rather than verbs - a row that acts still works there,
# as a page of one, but the shipped tree puts none there.
#
# Inside a group, a tile is placed by how often a thumb reaches for it: the
# order here is the order they are packed in, left to right and top to bottom,
# and a `row_break` tile ends a row so a group of them reads as a group.
#
# A page may also spend **X and Y** on a job of its own, and the legend along
# the foot prints what it spent them on. Not A and B: the contract is that A
# commits and B leaves, in every layer and every surface, and a page that took
# either would be the one place on the pad where that stopped being true. A
# page taking X keeps `menu:close` on the hold, because X is how you leave
# from anywhere else in here.
#
# Nothing in the shipped tree spends one, and that is the answer rather than
# an omission: `bindings.md` lets an override take a button only when what it
# would do is **not reachable on screen**, and on a page of tiles it almost
# always is. Play / pause on the Now page is the worked example of when not
# to - the tile is right there.
#
#   [[menu.items]]
#   label = "Apps"
#
#     [menu.items.keys]
#     Y = { tap = "exec:omarchy-menu toggle apps", short = "All" }
#
# The chips are in that same order - what you change now, then what you open,
# then what is on screen, then the room, then the pad, then the machine.
# ---------------------------------------------------------------------------

# What you change while you are sitting in the room, on the chip the menu
# opens on. How loud, what is playing, something to type with and something
# to time with - in one place, because they are what the menu is opened for
# from a sofa.
#
# They used to be the top of Audio and the top of Display, which was right
# while the menu was one column and there was no nearer place to put them.
# There is now. What stays behind on those pages is what you set when the room
# changes rather than while you are sitting in it - how bright the screen is
# among them, because that one follows the light in the window rather than
# what you are doing with the machine.

[[menu.items]]
icon = "󰀻"
label = "Apps"
detail = "Steam, chat, music, video"
# What a nav card says under its name: the state of the place it opens, in
# the two or three words that fit. A bare word is printed as it is; a table
# runs a command, and `ttl` is how long its answer stays fresh - the bar has
# one of these per group, so a card without a ttl is a subprocess a second.
# `empty` is what it says when the command prints nothing. Left out entirely,
# a card falls back to how many tiles its page holds.

  # Steam first: on a sofa it is what the menu is opened for. The URL form
  # works either way - it starts Steam in Big Picture when it is closed, and
  # flips an already-running Steam into it.
  #
  # **Half the page, and everything after it a quarter.** Seven apps at two
  # cells each left the second band a third full - two small squares under a
  # row of six - so the page is cut the other way: one tile that says what
  # this machine is for, and six of one size under and beside it. Three
  # cells is also where a name stops being cut in half and where the line
  # under it has somewhere to go: `Big Picture`, `Voice chat`, `Video`.
  [[menu.items.items]]
  icon = ""
  label = "Steam"
  span = [6, 2]
  detail = "Big Picture"
  action = "exec:steam steam://open/bigpicture"

  # Then the two that make the sofa a sofa rather than a desk, in the order a
  # couch reaches for them. Both launch **or focus**: with a pointer this slow
  # a second copy of a chat client or a second music player is never what was
  # asked for, and `omarchy-launch-or-focus` matches the class *and* the title,
  # so it finds the window whichever way the thing is installed.
  #
  # Discord is the row that cannot assume anything: Omarchy installs it as a
  # webapp as readily as pacman installs the client, and the two have nothing
  # in common but the name. So the row asks - `omarchy-cmd-present` picks the
  # native client when there is one and falls back to the webapp when there is
  # not. See [profile.discord] for what the pad does once it is in front.
  [[menu.items.items]]
  icon = "󰙯"
  label = "Discord"
  span = [3, 2]
  detail = "Voice chat"
  action = 'exec:omarchy-launch-or-focus discord "$(omarchy-cmd-present discord && echo uwsm-app -- discord || echo omarchy-launch-webapp https://discord.com/channels/@me)"'

  # Spotify has a launcher of Omarchy's own that focuses a running one and
  # offers to install a missing one, which is more than this row could do.
  [[menu.items.items]]
  icon = "󰓇"
  label = "Spotify"
  span = [3, 2]
  detail = "Music"
  action = "exec:omarchy-launch-spotify"

  # The television. A game console has one of these and a desktop does not,
  # which is most of the difference this project is about; the webapp is a
  # window of its own rather than a tab, so the pad can walk to it.
  [[menu.items.items]]
  icon = "󰗃"
  label = "YouTube"
  span = [3, 2]
  detail = "Video"
  action = "exec:omarchy-launch-or-focus youtube 'omarchy-launch-webapp https://www.youtube.com'"

  # What a couch might add next, and why neither is here: Battle.net
  # (`omarchy-launch-battlenet`) says nothing at all when it is not installed,
  # and a row that does nothing visible is worse from a sofa than no row; OBS
  # is a desk's tool, and the CAPTURE button already records.

  [[menu.items.items]]
  icon = ""
  label = "Browser"
  span = [3, 2]
  action = "exec:omarchy-launch-browser"

  [[menu.items.items]]
  icon = ""
  label = "Terminal"
  span = [3, 2]
  action = "exec:omarchy-launch-terminal"

  # Everything installed, which is a list no controller menu should try to be.
  [[menu.items.items]]
  icon = "󰀻"
  label = "All apps"
  span = [3, 2]
  detail = "Everything installed"
  action = "exec:omarchy-menu toggle apps"

[[menu.items]]
icon = "󰖯"
label = "Spaces"
detail = "Sets of apps, and the window in front"
meta = { from = "hyprctl activeworkspace -j | jq -r '\"\\(.windows) open\"'", ttl = 3 }

  # **A space is a workspace with a name and the apps that belong on it.**
  # This page was one card of window verbs, named for what it had not got
  # (decision 83); what it had not got is somewhere to go. A console calls
  # these spaces and a desktop calls them workspaces, and the difference is
  # that one of them knows what is meant to be open.
  #
  # Pressing one goes to its workspace, and **opens its apps only if the
  # workspace is empty**. That is the whole of the saving: nothing here
  # tracks which window is whose, so the one question it can answer honestly
  # is whether anything is there yet. A second press goes back to what you
  # left, rather than opening a second Spotify beside the first.
  #
  # These three are examples, the ones the Console OS mockup draws - rename
  # them, point them at other workspaces, give them other apps. The action is
  # ordinary shell; each app is started with `&` so that one that is slow to
  # start does not hold up the next.
  #
  # Three cells each rather than four: three spaces at four fill the twelve
  # columns exactly, and a screen that shows nine of them - 1080p does - cut
  # the third in half. At three they are one row that fits.
  [[menu.items.items]]
  icon = "󰊗"
  label = "Lounge"
  span = [3, 2]
  detail = "Steam, Spotify, Discord on workspace 1"
  action = """exec:hyprctl dispatch "hl.dsp.focus({ workspace = '1' })" >/dev/null
    [ "$(hyprctl activeworkspace -j | jq .windows)" -gt 0 ] && exit 0
    steam steam://open/bigpicture & omarchy-launch-spotify &
    $(omarchy-cmd-present discord && echo uwsm-app -- discord || echo omarchy-launch-webapp https://discord.com/channels/@me) &"""

  [[menu.items.items]]
  icon = "󰖟"
  label = "Focus"
  span = [3, 2]
  detail = "Browser alone on workspace 2"
  action = """exec:hyprctl dispatch "hl.dsp.focus({ workspace = '2' })" >/dev/null
    [ "$(hyprctl activeworkspace -j | jq .windows)" -gt 0 ] || omarchy-launch-browser"""

  [[menu.items.items]]
  icon = "󰀎"
  label = "Co-op night"
  span = [3, 2]
  detail = "Steam and Discord on workspace 3"
  action = """exec:hyprctl dispatch "hl.dsp.focus({ workspace = '3' })" >/dev/null
    [ "$(hyprctl activeworkspace -j | jq .windows)" -gt 0 ] && exit 0
    steam steam://open/bigpicture &
    $(omarchy-cmd-present discord && echo uwsm-app -- discord || echo omarchy-launch-webapp https://discord.com/channels/@me) &"""

  # The spaces are nine columns and the page is twelve, and the page is
  # packed first fit: without a break the lock would take the hole beside
  # them, off the edge of a screen that shows nine.
  [[menu.items.items]]
  control = "row_break"

  # **One card, not four cells.** Every one of these is a verb with nothing
  # to show but its name, and at one cell each that name was `Fullscre…`,
  # `Next win…`, `Float / …` and `Close wi…` - four words cut in half on a
  # page with two thirds of itself empty. Stacked, each row has the card.
  #
  # And no mark in front of a row, the way `Power` carries none: a glyph at a
  # row's head is read as a bullet, and four of them in a column are four
  # bullets before four words that are each already the whole of what the row
  # does.
  #
  # Half the page wide rather than a quarter. A card is read where it
  # stands, and this one's heading is the **window's own name** - thirty-four
  # characters of somebody else's title, which is two cells of elision at
  # three. The page holds nothing else, so there is nothing for the width to
  # take from; what the other half is still waiting for is a second card,
  # not a wider first one.
  [[menu.items.items]]
  label = "Windows"
  control = "rows"
  span = [6, 3]
  detail = "Close window is held, not pressed"
  # **And the heading names the window rather than the page.** `Close window`
  # is the row on this surface where a written line is not enough: the menu
  # blurs what is behind it, so the thing about to be closed is a shape you
  # cannot read, and `WINDOWS` over four verbs says only what the page is
  # already called. A `meta` is the one line a tile can have that knows what
  # the machine is doing, and here it answers the question the card is for.
  #
  # The title where there is one and the class where there is not - a window
  # with no title still has a name - cut to what a heading holds. Two seconds
  # of freshness: nothing takes focus while the menu is up, so this is about
  # what was in front when it opened rather than about keeping up with
  # anything.
  meta = { from = """hyprctl activewindow -j | jq -r 'if (.title // "") != "" then .title else (.class // "") end' | cut -c1-34""", ttl = 2, empty = "Windows" }

    [[menu.items.items.items]]
    label = "Fullscreen"
    detail = "Make it fill the screen"
    action = "hypr:hl.dsp.window.fullscreen({ mode = 'fullscreen' })"

    [[menu.items.items.items]]
    label = "Next window"
    action = "hypr:hl.dsp.window.cycle_next()"

    [[menu.items.items.items]]
    label = "Float / tile"
    action = "hypr:hl.dsp.window.float({ action = 'toggle' })"

    [[menu.items.items.items]]
    label = "Close window"
    action = "hypr:hl.dsp.window.close()"
    # Held, not pressed: a terminal running something, an editor with an unsaved
    # buffer and a browser with a half-written message all close the same way,
    # and none of them comes back. The terminal is asked first either way (see
    # [terminal]), but what that asks about is a command, not the window.
    confirm = true

  # Who the presses go to. On Spaces because the lock is a workspace lock -
  # it holds the pad to the game on this one - and keeping the controller is
  # its other side; both were on `Now` until that page was given out
  # (decision 86).
  #
  # And why they are not at the top level, where they once were. Item 48 put them there because a row you have to go and
  # find is a row that is not there - and the bar has no room for a verb.
  # What answers it now is that the menu **comes back where it was**: use one
  # of these once and it is what the next press opens on, which is nearer
  # than a top-level row in a list of ten ever was and costs no rule.
  #
  # `open_on = true` is the other answer and is still there to be written:
  # while the condition holds, the menu opens *on* that tile whatever it was
  # doing last. Neither ships with it, because a menu that overrode where you
  # left off would take the first answer away.
  #
  # The states a tile may wait for are `game`, `handed_over`, `locked` and
  # `kept`; any one of those listed is enough.
  #
  # A quarter of the page each, beside the window card. They were half the
  # page on `Now`, where they made a row of their own; here they stand in the
  # three columns the card leaves, and on a screen that shows nine of the
  # twelve the lock - the one offered in game mode - is the one that fits.
  [[menu.items.items]]
  icon = "󰌾"
  label = "Workspace lock"
  detail = "Every press goes to the game"
  span = [3, 1]
  action = "lock:toggle"
  when = ["game", "handed_over"]
  stay = true

  # Its pair, for the case the hand-off is right about and nobody can use. A
  # cloud client opens the pad as its page loads, so the launcher screen in
  # front of the stream - a web page, which reads no pad at all - is handed the
  # pointer and offers nothing to press it with; measured with GeForce NOW,
  # whose session then never starts. This takes the pad back, and keeps it
  # until it is given up again.
  [[menu.items.items]]
  icon = "󰕾"
  label = "Keep the controller"
  detail = "Every press drives the desktop"
  span = [3, 1]
  action = "keep:toggle"
  when = ["handed_over", "kept"]
  stay = true

  # Notifications kept off the screen - over a film, over a co-op night on a
  # call. On this page because it is a question about the session in front,
  # the way the lock is, rather than about the machine. After the lock and
  # its pair so it takes the strip beside the window card whether or not
  # they are there; three wide, the width of the column it stands in.
  [[menu.items.items]]
  label = "Do not disturb"
  span = [3, 1]
  control = "toggle"
  reads = "live:dnd"

[[menu.items]]
icon = ""
label = "Sound"
detail = "What is playing, and where it goes"
meta.ttl = 5
# What is playing when something is, and which speakers when nothing is -
# the one line that says both whether and where. The title is cut to what a
# nav card holds.
#
# The active *port*, not the sink: a sink is called `Built-in Audio Analog
# Stereo` and a nav card has room for `Speakers`. Two passes because the port
# the sink is on is printed after the list of ports it could be on.
meta.from = '''
  title=$(omarchy-shell media status 2>/dev/null | jq -r 'if .hasMedia and .title != "" then .title else "" end' 2>/dev/null | cut -c1-16)
  [ -n "$title" ] && { echo "$title"; exit 0; }
  port=$(pactl list sinks | awk -v s="$(omarchy-audio-output-sink)" '$1=="Name:"{f=($2==s)} f && $1=="Active" && $2=="Port:"{print $3; exit}')
  pactl list sinks | awk -v s="$(omarchy-audio-output-sink)" -v p="$port:" '$1=="Name:"{f=($2==s)} f && $1==p {sub(/^[^:]*: /, ""); sub(/ \(.*/, ""); print; exit}'
'''

  # What is playing, in somebody else's words: a title and an artist, which
  # are as long as they are. Half the page, which is what the title is given
  # on the page that is about sound: how loud, and what. It reads what the
  # machine is doing rather than what omapad holds, which is the other half
  # of `reads`; see [live] for the commands behind it.
  #
  # These were the `Now` page, with the keyboard and the stopwatch, until the
  # quick menu took the keyboard and the volume onto a button of their own
  # and `Now` was left holding sound under a name that said nothing about it
  # (decision 86). Sound is where somebody looks for what is playing.
  [[menu.items.items]]
  label = "Music"
  empty = "Nothing playing"
  span = [6, 2]
  control = "media"
  reads = "live:media"

  # **How loud, as the one control on this pad a thumb can copy.** A slider is
  # a length and a knob is an angle, and the stick this page is walked with is
  # already a turn - so a held ring is turned by carrying the thumb round it
  # rather than by pushing a direction and waiting. Volume is where that is
  # worth a square: it is the value reached for most often from a sofa, and
  # the one nobody wants to step towards.
  #
  # It does not go through `omarchy-audio-output-volume`, and that is the
  # point of it: the helper always ends in `omarchy-osd`, so every press
  # would raise Omarchy's own overlay over the tile showing the same number.
  # [live] volume_set is a setting, so anyone who wants the OSD back puts the
  # helper there.
  #
  # Brightness on `Display` is deliberately still a bar, and the comparison
  # survives the page it moved to: a length is read faster and a ring is
  # turned better, and neither drawing is the better one. What decides where
  # a tile lives is the errand, not the picture - how loud moves with the
  # film, how bright follows the light in the window.
  #
  # **Nine columns, not twelve.** The page is twelve wide and a 1080p screen
  # shows nine of them, so a transport stacked in the last two columns was a
  # transport off the edge. Six for the title and two for the ring is the
  # first band; the three verbs are the band under it.
  [[menu.items.items]]
  label = "Volume"
  control = "knob"
  reads = "live:volume"

  # The title and the ring are two rows tall; the transport under them is
  # one. The break is what says so.
  [[menu.items.items]]
  control = "row_break"

  # The three ways to walk what is playing. A on the tile above plays and
  # pauses it - it has two states, so it needs no mode of its own - and
  # these are the presses that cannot be made on a tile that has only two.
  #
  # Three tiles rather than a transport drawn inside the media one: left and
  # right already mean "the tile that way", so the grid walks to them
  # without a button learning a second meaning anywhere. A tile costs nobody
  # a reflex, which is the same argument that keeps every page's X and Y
  # unspent.
  #
  # Three cells each rather than one: `Previous` is a word, and a cell holds
  # about as much of it as `Previo…`. Three of three is the nine columns the
  # band above comes to, and a transport that wide is one a thumb lands on
  # without aiming.
  [[menu.items.items]]
  icon = "󰒮"
  label = "Previous"
  span = [3, 1]
  action = "live:media=previous"
  stay = true

  [[menu.items.items]]
  icon = "󰒭"
  label = "Next"
  span = [3, 1]
  action = "live:media=next"
  stay = true

  # What is playing above; where it goes below.
  [[menu.items.items]]
  icon = "󰝟"
  label = "Mute"
  span = [3, 1]
  control = "toggle"
  reads = "live:mute"

  [[menu.items.items]]
  control = "row_break"

  # **Two cards that list, rather than a page holding two pages.** It was
  # `Devices` opening on `Output` opening on the outputs - two presses in
  # before a name you can pick, and each of those pages held exactly one
  # thing. A card is read where it stands, so both lists are on this page
  # and a device is one press away.
  #
  # What is plugged in is not something a config file knows: `from` is a
  # command and each line it prints is a row - the label, then the values
  # `action` takes as `%1` and `%2`, tab separated. A label starting with
  # `*` is the one in force and is drawn filled, which is the mark `pactl`
  # and `wpctl` already put beside the current device. Values are quoted as
  # they go in, so a device that names itself with a space or a semicolon
  # stays a name rather than becoming a second command.
  #
  # The card is read when this page settles rather than at a press, because
  # nobody enters a card - `[menu] group_settle_ms` is the same wait the bar
  # takes, for the same reason.
  # Neither row can be written down here, because what is plugged in is not
  # something a config file knows. `from` is a command, and each line it
  # prints is a row: the label, then the values `action` takes as `%1` and
  # `%2`, tab separated. A label starting with `*` is the one in force and is
  # ticked - the mark `pactl` and `wpctl` already put beside the current
  # device. Values are quoted as they go in, so a device that names itself
  # with a space or a semicolon stays a name rather than becoming a second
  # command.
  #
  # The outputs are the ones Omarchy's own switcher offers: a sink whose only
  # ports are unplugged is left out, and so is the physical sink a speaker
  # tuning fronts - picking that one would bypass the tuning rather than send
  # the sound anywhere new.
  #
  # Six cells each, which is what a device calls itself: `Built-in Audio
  # Analog Stereo` and `HDA Intel PCH Digital Stereo (HDMI 2)` are the names
  # these lists are made of, and at three cells every row on the page was
  # the first half of one. Two of them fill the page across, which is the
  # other half of the reason: this page is two lists and nothing else.
  [[menu.items.items]]
  label = "Output"
  control = "rows"
  span = [6, 3]
  detail = "Speakers, headphones, the TV"
  empty = "No outputs found"
  action = "exec:omarchy-audio-output-set-default %1 %2"
  from = '''
    fronted=$(omarchy-audio-tuning fronted-sink 2>/dev/null || true)
    pactl -f json list sinks |
      jq -r --arg cur "$(pactl get-default-sink)" --arg fronted "$fronted" '
        .[] | select($fronted == "" or .name != $fronted)
            | select((.ports | length == 0)
                     or ([.ports[]? | .availability != "not available"] | any))
            | (if .name == $cur then "* " else "" end) + (.description // .name)
              + "\t" + (.index | tostring) + "\t" + .name'
  '''

  # The inputs are every source that is not a monitor - a monitor is what the
  # speakers are already playing, not something anybody speaks into. No
  # availability filter here, unlike the outputs above: a built-in microphone
  # reports its jack as unplugged and is still the microphone in use, so
  # filtering on it would hide the row that is ticked.
  [[menu.items.items]]
  label = "Microphone"
  control = "rows"
  span = [6, 3]
  detail = "Built-in, headset, webcam"
  empty = "No microphones found"
  action = "exec:omarchy-audio-input-set-default %1 %2"
  from = '''
    pactl -f json list sources |
      jq -r --arg cur "$(pactl get-default-source)" '
        .[] | select(.properties["device.class"] != "monitor")
            | (if .name == $cur then "* " else "" end) + (.description // .name)
              + "\t" + (.index | tostring) + "\t" + .name'
  '''

  # The third card on this page, and the one that is not a device. The two
  # above it say where the sound comes from and goes to; this one says where
  # the *words* go, which is the same question asked of the microphone's other
  # end - so it is here rather than under `Controller`, where the button that
  # opens the microphone lives.
  #
  # A switch, because there are two places and the tile draws which one it is
  # in. What it runs is `[osk] dictate_clipboard_on` and its pair: omapad does
  # not see the words, so switching where they land is something it asks
  # voxtype to do.
  [[menu.items.items]]
  icon = "󰅍"
  label = "Dictate to clipboard"
  detail = "Instead of typing at the cursor"
  # Half the row, under the card whose other end it is about. A switch is a
  # switch at any width, and at one cell this one was a square in the corner
  # of a page made of two tall lists - the only tile on it standing on no
  # column anything else stood on.
  span = [6, 1]
  control = "toggle"
  reads = "pad:dictate_clipboard"

[[menu.items]]
icon = "󰍹"
label = "Display"
detail = "How big, how bright, which screen"
meta = { from = "hyprctl monitors -j | jq -r '.[] | select(.focused) | \"\\(.height)p · \\(.refreshRate|floor) Hz\"'", ttl = 30 }

  # How bright first: it follows the light coming in the window rather than
  # what you are doing with the machine, so it is the one thing on this page
  # reached for every evening. It reads what the machine is doing rather
  # than what omapad holds - the other half of `reads`; see [live] for the
  # commands behind it.
  [[menu.items.items]]
  label = "Brightness"
  span = [6, 1]
  control = "slider"
  reads = "live:brightness"

  # The two switches beside it, halves of the same row: the warm screen is
  # the evening's other answer to the light, and staying awake is what a film
  # needs from a machine that measures idle by the pad lying still. Both are
  # Omarchy's own switches, so its bar and its menu agree with them.
  [[menu.items.items]]
  label = "Night light"
  span = [3, 1]
  control = "toggle"
  reads = "live:nightlight"

  [[menu.items.items]]
  label = "Stay awake"
  span = [3, 1]
  control = "toggle"
  reads = "live:stay_awake"

  # **One card, not three cells.** Every one of these is a verb with nothing
  # to show but its name, and at a cell each the name was the half of it that
  # fitted - `Scale u…`, `Screensa…` - with the line saying what it does drawn
  # nowhere at all, because a tile one row tall has no room for one. Stacked,
  # each row has the width of the card and the sentence back.
  #
  # Two stepping rows rather than a bar: a step here reconfigures the
  # monitor and rewrites monitors.lua, which is not something to sweep a
  # trigger through. Scale is also a thing you set once for where you are
  # sitting, not one you push about.
  #
  # Two rows tall rather than three. Three verbs and a heading fit a card
  # this tall - `Power` holds five rows in three - and it stands beside the
  # card of screens at the same height, so the band is whole.
  [[menu.items.items]]
  label = "Screen"
  control = "rows"
  span = [6, 2]
  detail = "Scale moves every window at once"

    [[menu.items.items.items]]
    label = "Scale up"
    detail = "Bigger text and windows"
    action = "exec:omarchy-hyprland-monitor-scaling up"

    [[menu.items.items.items]]
    label = "Scale down"
    detail = "Smaller text, more on screen"
    action = "exec:omarchy-hyprland-monitor-scaling down"

    [[menu.items.items.items]]
    label = "Screensaver"
    detail = "Blank the screen now"
    action = "exec:omarchy-launch-screensaver force"

  # Which screens are lit, for a laptop plugged into a television. Listed
  # rather than written, because the three answers only exist while there is
  # a second screen and a laptop panel to be the first: anywhere else the
  # card says so and offers nothing to press.
  #
  # All three go through Omarchy's own monitor switches, which write the
  # toggles its config reads and reload Hyprland - so they survive a reload,
  # unlike the size and the rate below, and a reload also puts those back.
  # The laptop panel is switched off only once mirroring is: Omarchy refuses
  # to turn off a panel another screen is copying.
  [[menu.items.items]]
  label = "Screens"
  control = "rows"
  span = [6, 2]
  empty = "No second screen"
  action = '''exec:
    case %1 in
      extend)
        omarchy-hyprland-monitor-internal-mirror off
        omarchy-hyprland-monitor-internal on ;;
      mirror)
        omarchy-hyprland-monitor-internal-mirror on ;;
      external)
        omarchy-hyprland-monitor-internal-mirror off
        omarchy-hyprland-monitor-internal off ;;
    esac
  '''
  from = '''
    [ -n "$(omarchy-hyprland-monitor-laptop)" ] &&
      omarchy-hyprland-monitor-external-active || exit 0
    now=extend
    omarchy-hyprland-toggle-enabled internal-monitor-mirror && now=mirror
    omarchy-hyprland-toggle-enabled internal-monitor-disable && now=external
    row() {
      mark=""; [ "$1" = "$now" ] && mark="* "
      printf '%s%s\t%s\n' "$mark" "$2" "$1"
    }
    row extend "Both, side by side"
    row mirror "Both, same picture"
    row external "Laptop screen off"
  '''

  # What the screen is driven at, under the card that says how big it is
  # drawn. Lists rather than steps, because neither is a ladder anybody
  # climbs: a television offers 4K, 1440p, 1080p and 720p and the answer is
  # one of them, not the next one along. Both are read from the monitor in
  # front, the one `Scale up` works on, so what a row offers is what that
  # screen said it can show - there is no mode here nobody asked it for.
  #
  # Two cards rather than one list of every mode, because a television
  # reports each size at six rates and one list was thirty rows of the same
  # four sizes. The pair is still one mode: picking a size keeps the rate in
  # force where the new size has it and takes the fastest where it has not,
  # and picking a rate keeps the size - read at the press rather than from
  # the list, which was written before the last pick and can be a size
  # behind until the page is entered again.
  #
  # Applied the way `omarchy-hyprland-monitor-scaling` applies a scale, with
  # the position, the scale and the rotation carried over. The scale is
  # rounded up to one the new size divides into whole pixels - Hyprland
  # refuses any other, and the scaling script rounds the same way. Nothing
  # is written to monitors.lua: a mode is a line there someone wrote by hand,
  # and one the television turns out not to show is undone by reloading
  # Hyprland rather than by finding that line from a black screen. So a
  # reload also puts back what that file says.
  #
  # The output name goes into a Lua string, so only a plain connector name
  # passes, and the value a row carries is matched whole before it is used.
  #
  # Four rows tall, a row more than the rates beside it: a television offers
  # more sizes than it offers rates at any one of them, and the row the rates
  # give up is the switch under them.
  [[menu.items.items]]
  label = "Resolution"
  control = "rows"
  span = [6, 4]
  detail = "Fewer pixels for a faster game"
  empty = "No screen found"
  action = '''exec:
    lua=$(hyprctl monitors -j | jq -r --arg want %1 '
      .[] | select(.focused) | select(.name | test("^[A-Za-z0-9._-]+$")) | . as $m
      | ($want | capture("^(?<w>[0-9]+)x(?<h>[0-9]+)$") | map_values(tonumber)) as $s
      | [.availableModes[]
         | capture("^(?<w>[0-9]+)x(?<h>[0-9]+)@(?<r>[0-9.]+)Hz$") | map_values(tonumber)
         | select(.w == $s.w and .h == $s.h) | .r] as $rates
      | select($rates | length > 0)
      | (first($rates[] | select((. * 100 | round) == ($m.refreshRate * 100 | round)))
         // ($rates | max)) as $r
      | ([$s.w * 120, $s.h * 120] | until(.[1] == 0; [.[1], .[0] % .[1]]) | .[0]) as $g
      | ([$m.scale * 120 | round, $g] | min | until($g % . == 0; . + 1) / 120) as $scale
      | "hl.monitor({ output = \"\(.name)\", mode = \"\($s.w)x\($s.h)@\($r)\", position = \"\(.x)x\(.y)\", scale = \($scale), transform = \(.transform) })"')
    [ -n "$lua" ] && hyprctl eval "$lua"
  '''
  from = '''
    hyprctl monitors -j |
      jq -r '
        .[] | select(.focused) | . as $m
        | [.availableModes[] | capture("^(?<w>[0-9]+)x(?<h>[0-9]+)@") | map_values(tonumber)]
        | unique | sort_by(-(.w * .h), -.w) | .[]
        | (if .w == $m.width and .h == $m.height then "* " else "" end)
          + "\(.w) × \(.h)\t\(.w)x\(.h)"'
  '''

  # The rates the size in force is offered at, fastest first. A rate is
  # ticked by what it rounds to, because the mode list says `60.08Hz` and
  # the monitor says 60.076.
  [[menu.items.items]]
  label = "Refresh rate"
  control = "rows"
  span = [6, 3]
  detail = "Higher is smoother motion"
  empty = "No screen found"
  action = '''exec:
    lua=$(hyprctl monitors -j | jq -r --arg want %1 '
      .[] | select(.focused) | select(.name | test("^[A-Za-z0-9._-]+$")) | . as $m
      | select($want | test("^[0-9]+([.][0-9]+)?$")) | ($want | tonumber) as $asked
      | [.availableModes[]
         | capture("^(?<w>[0-9]+)x(?<h>[0-9]+)@(?<r>[0-9.]+)Hz$") | map_values(tonumber)
         | select(.w == $m.width and .h == $m.height) | .r]
      | select(length > 0) | min_by(. - $asked | fabs) as $r
      | "hl.monitor({ output = \"\($m.name)\", mode = \"\($m.width)x\($m.height)@\($r)\", position = \"\($m.x)x\($m.y)\", scale = \($m.scale), transform = \($m.transform) })"')
    [ -n "$lua" ] && hyprctl eval "$lua"
  '''
  from = '''
    hyprctl monitors -j |
      jq -r '
        .[] | select(.focused) | . as $m
        | [.availableModes[]
           | capture("^(?<w>[0-9]+)x(?<h>[0-9]+)@(?<r>[0-9.]+)Hz$") | map_values(tonumber)
           | select(.w == $m.width and .h == $m.height) | .r]
        | unique | reverse | .[]
        | (if (. * 100 | round) == ($m.refreshRate * 100 | round) then "* " else "" end)
          + "\(. * 100 | round / 100) Hz\t\(.)"'
  '''

  # Under the rates, because it is the rate's other answer: not which one,
  # but whether it may move with the game. What on means is `[live] vrr_set`.
  [[menu.items.items]]
  icon = "󰍹"
  label = "VRR"
  detail = "Rate follows the game in fullscreen"
  span = [6, 1]
  control = "toggle"
  reads = "live:vrr"

# The pad itself: what it does, what it is, and how it feels. Loose rows in the
# root menu and a line in a config file before; a controller is one thing and
# reads as one row.
#
# **Inside, the page is two bands rather than twelve tiles.** A switch, a bar,
# a card and a door used to stand in the order they were written in, at four
# heights, none of them lining up with the next - which is a page you read
# through rather than glance at. The first row is what a press answers with,
# each switch beside the bar that says how much of it; under it stand the
# three cards that say what this pad is, what it prints and what its buttons
# do, with the page's two loose switches and its one door in a column beside
# them.

[[menu.items]]
icon = "󰊴"
label = "Controller"
detail = "Speed, vibration, labels, mapping"
meta = { from = "ls /dev/input/by-id/ 2>/dev/null | grep -c event-joystick | awk '{print ($1 == 1) ? \"1 paired\" : $1 \" paired\"}'", ttl = 5, empty = "None paired" }

  # The one tile that is only ever here once. A machine driven from a sofa is
  # the machine nobody walks to a keyboard to set up, so the first start has
  # to offer what a first start decides - what the buttons do, and what a
  # press answers with - from the pad itself. `[menu] first_run` is the mark;
  # opening the menu is what clears it, so this is shown once and then gone.
  #
  # Its page is not a fifth place to keep these settings: every row on it
  # reads the same `pad:` setting its home row does, so the two say one thing
  # and stay in step by construction.
  [[menu.items.items]]
  icon = "󰋗"
  label = "Start here"
  detail = "The buttons, and how a press answers"
  # Half the page, at the head of the one open it is ever drawn on, and on
  # `Controller` because everything it holds is about the pad - it opened
  # the page that was called `Now` until that page was given out to the
  # places its tiles belong (decision 86). **No row break under it**,
  # because the first press anybody makes on this page is a direction, and
  # a tile alone in its row answers only one of the four.
  #
  # Six is the widest span the shipped tree spends anywhere, and that is a
  # rule rather than a coincidence: `build` refuses a span wider than the
  # columns there are, `[menu] columns` is a setting, and six is the width
  # below which there is nowhere to put a bar. A twelve-cell tile is a menu
  # that will not build for somebody who narrowed their page.
  span = [6, 1]
  when = ["first_run"]
  open_on = true

    # A quarter of the row each, which is what `Remap the buttons` needs to
    # be read at all and what leaves the two switches beside it standing on
    # the same columns. The two bars under them take half the row each: six
    # tiles, two whole rows, on the one page somebody meets before they know
    # what any of this is.
    [[menu.items.items.items]]
    icon = ""
    label = "Shortcuts"
    detail = "What every button does"
    span = [3, 1]
    action = "guide:open"

    [[menu.items.items.items]]
    icon = "󰘮"
    label = "Remap the buttons"
    detail = "Teach it which button is which"
    span = [3, 1]
    action = "map:open"

    [[menu.items.items.items]]
    icon = "󰕦"
    label = "Vibration"
    span = [3, 1]
    control = "toggle"
    reads = "pad:rumble"

    [[menu.items.items.items]]
    icon = "󰕾"
    label = "Sounds"
    span = [3, 1]
    control = "toggle"
    reads = "pad:sound"

    [[menu.items.items.items]]
    icon = "󰓅"
    label = "Motion"
    span = [6, 1]
    control = "slider"
    reads = "pad:motion"

    [[menu.items.items.items]]
    label = "Hold time"
    span = [6, 1]
    control = "slider"
    reads = "pad:hold_scale"

  # A switch, because there are two states and the tile draws which one it is
  # in.
  [[menu.items.items]]
  icon = "󰕦"
  label = "Vibration"
  control = "toggle"
  reads = "pad:rumble"

  # And how hard, which is a number and so a bar. The motor ticks once at the
  # level you let go on rather than at every step on the way: the number says
  # nothing and the buzz says everything, but a buzz per step of a sweep says
  # nothing either.
  [[menu.items.items]]
  label = "Strength"
  control = "slider"
  reads = "pad:rumble_strength"

  # The other half of what a press says back, and the pair reads as a pair on
  # purpose: the motor answers the hands and this answers the room, so
  # whoever turns one off is choosing between them rather than losing both.
  # It ships off - see `[sound]` - so this switch is how most people will
  # ever hear it.
  [[menu.items.items]]
  icon = "󰕾"
  label = "Sounds"
  control = "toggle"
  reads = "pad:sound"

  # And how loud, which is the same question `Strength` asks about the motor
  # and gets the same shape of answer. A tenth per step rather than the
  # motor's twentieth: a cue is 90 ms at the longest, and a difference you
  # cannot hear between two presses is not a step worth stopping on.
  [[menu.items.items]]
  label = "Loudness"
  control = "slider"
  reads = "pad:sound_volume"

  # How long every hold on this pad takes, against the lengths they were
  # written at. It is on the pad because it is about the hand: a hold is two
  # seconds of keeping a shoulder down, which is a gesture some hands cannot
  # make at all and others make by accident. `[confirm]` is where the same
  # number is set at a keyboard, along with the slip a counting hold survives.
  #
  # It ends the band because it is the one thing on it a press answers with
  # that is not a noise: the four before it are the motor and the speaker,
  # and this is the wait in front of them. A cell wider than the two bars
  # beside it, which is what takes the band to twelve: the pair of switches
  # stay the same size as each other, and the row ends where the cards
  # under it end rather than a cell short of the edge.
  [[menu.items.items]]
  label = "Hold time"
  span = [4, 1]
  control = "slider"
  reads = "pad:hold_scale"

  [[menu.items.items]]
  control = "row_break"

  # What the badges print, which is a second question from the profile below:
  # a PlayStation pad reports itself as an XInput one, so it takes the Xbox
  # profile and prints shapes. `auto` follows the profile.
  #
  # **A card, not a page.** It was a submenu, and it was one for the reason
  # a card now answers: a `choice` tile shows one value, so the line under
  # each choice saying *how* they differ had nowhere to go - and getting
  # this wrong scrambles the face buttons. A row is as wide as the card, so
  # it keeps that line, and all four are in front of you rather than a
  # level down.
  [[menu.items.items]]
  label = "Button labels"
  control = "rows"
  span = [3, 3]
  detail = "What the badges print"

    [[menu.items.items.items]]
    label = "Follow the pad"
    detail = "What the pad reports it is"
    action = "pad:layout=auto"
    stay = true

    [[menu.items.items.items]]
    label = "Nintendo"
    detail = "A B X Y, ZL and ZR, − and +"
    action = "pad:layout=nintendo"
    stay = true

    [[menu.items.items.items]]
    label = "Xbox"
    detail = "LB and LT, View and Menu"
    action = "pad:layout=xbox"
    stay = true

    [[menu.items.items.items]]
    label = "PlayStation"
    detail = "Shapes, L1 and L2, Create and Options"
    action = "pad:layout=playstation"
    stay = true

  # Which codes the pad is read with. `auto` is what the driver says it is,
  # which is right until it is not: a pad with a hardware mode switch reports
  # one thing and prints another, and that is the whole reason this is a
  # choice. Getting it wrong scrambles the face buttons, and `Remap the
  # buttons` in the card beside it is what answers a pad neither profile fits.
  #
  # A card for `Button labels`' reason, and a stronger one: getting this
  # wrong scrambles the face buttons, and the sentence under each row is
  # exactly what stops you.
  [[menu.items.items]]
  label = "Profile"
  control = "rows"
  # Three rows tall rather than two, which is a measurement about the band
  # rather than about the card: three cards standing at two heights is what
  # made this page read as a heap, and the rows have the air to spare.
  span = [3, 3]
  detail = "Which codes this pad sends"

    [[menu.items.items.items]]
    label = "Detect it"
    detail = "Follow what the driver reports"
    action = "pad:profile=auto"
    stay = true

    [[menu.items.items.items]]
    label = "Nintendo Pro"
    detail = "A Switch pad, or one in NS mode"
    action = "pad:profile=nintendo_pro"
    stay = true

    [[menu.items.items.items]]
    label = "Xbox"
    detail = "An XInput pad - most of them"
    action = "pad:profile=xbox"
    stay = true

  # The two doors that are about the buttons themselves - one asks what they
  # do, the other teaches it which is which - and they are a card for the
  # reason `Windows` is: both are verbs with a sentence under them, and a
  # cell one row tall has room for neither the whole name nor the line. They
  # were `Shortcut…` and `Remap th…` at a cell each, with the sentences that
  # tell the two apart drawn nowhere.
  #
  # A press further in than they used to be, which is what a card costs: A
  # goes into it, then the row. The guide is on Y from anywhere, so the one
  # that is opened in a hurry is not the one that got longer.
  [[menu.items.items]]
  label = "Buttons"
  control = "rows"
  span = [3, 3]
  detail = "Look them up, or teach it a new pad"

    [[menu.items.items.items]]
    label = "Shortcuts"
    detail = "What every button does"
    action = "guide:open"

    [[menu.items.items.items]]
    label = "Remap the buttons"
    detail = "Teach it which button is which"
    action = "map:open"

  # How the two thumbs feel. Nobody can pick these at a keyboard: they depend
  # on the pad, the screen and how far away the sofa is, and the answer is
  # felt rather than reasoned about. Both sticks stay live under the open
  # menu, so the one you are complaining about answers while you move it.
  #
  # This was two pages of four stepping rows - Speed and Dead zone - and the
  # argument for keeping them apart was that eight of those on one screen is a
  # list nobody reads from across a room. Four sliders is not that list: each
  # one shows where its number is and where the ends are, which is the whole
  # of what eight rows saying "faster" and "slower" could not. The speeds are
  # the first line and the dead zones the second, so the page is still two
  # answers rather than one heap.
  #
  # **And the two dials stand where the two thumbs do**, one at each end of
  # the page with the four bars between them: the left stick's dial on the
  # left, the right stick's on the right, which is a page somebody can point
  # at while they complain about a thumb. Four cells a bar and a square at
  # each end comes to twenty-four, so the page is two whole rows - it was
  # three, with the dials in a corner of a row that was two thirds empty.
  # No row break anywhere on it: a break counts from the foot of everything
  # flowed before it, and a dial two rows tall would push the line under it
  # down past its own second row.
  #
  # A dead zone is the other end of the same stick: travel that does nothing.
  # By stick rather than by what the stick is doing, because that is where the
  # slop is - and because from the sofa the complaint is always about a thumb
  # you are holding, not about a role you would have to look up. A stick that
  # wanders on its own wants a wider zone; aim that starts late a narrower one.
  #
  # It heads the column beside the cards, three cells wide like everything
  # under it: the page's one door in, over the two switches that are the rest
  # of what it holds.
  [[menu.items.items]]
  icon = "󰍽"
  label = "Sticks"
  detail = "Speed, and travel that does nothing"
  span = [3, 1]

    # And the same two numbers again, as the thing they are about: a dial per
    # stick, with the dead zone shaded and a dot where the thumb actually is.
    # Push the stick and watch the dot cross the shading - which is the whole
    # question, and one no number could ever answer. A bar sets it, a dial
    # says what it did; take either and both move.
    #
    # These are the only tiles that draw something no config file holds, so
    # they are the only ones the menu streams for - and only while one of
    # them is the tile in front. See [menu] live_hz.
    [[menu.items.items.items]]
    label = "Left stick"
    control = "gauge"
    reads = "pad:left_deadzone"
    shows = "left"

    [[menu.items.items.items]]
    label = "Pointer"
    span = [4, 1]
    control = "slider"
    reads = "pad:pointer_speed"

    [[menu.items.items.items]]
    label = "Scroll"
    span = [4, 1]
    control = "slider"
    reads = "pad:scroll_speed"

    [[menu.items.items.items]]
    label = "Right stick"
    control = "gauge"
    reads = "pad:right_deadzone"
    shows = "right"

    [[menu.items.items.items]]
    label = "Left dead zone"
    span = [4, 1]
    control = "slider"
    reads = "pad:left_deadzone"

    [[menu.items.items.items]]
    label = "Right dead zone"
    span = [4, 1]
    control = "slider"
    reads = "pad:right_deadzone"

  # The pointer is the one thing on screen a press cannot push out of the way,
  # so the press puts it away instead. Under Controller rather than Display:
  # what it answers to is the pad, and the tile above it is where the
  # pointer's other two questions are kept.
  #
  # Both rows stay and both tick, the way the vibration pair does - which of
  # the two is in force is what somebody opened this page to find out.
  [[menu.items.items]]
  icon = "󰍽"
  # Three cells, which is the width of the column it stands in: three words
  # over a switch do not fit in fewer, and a tile narrower than the one above
  # it would be a column with a step in it.
  span = [3, 1]
  label = "Hide the pointer"
  control = "toggle"
  reads = "pad:hide_pointer"

  # And how they are drawn, which is the same question `Button labels` asks
  # about the shape instead of the letter. A stencil badge is the one to reach
  # for when the screen is across a room; a filled one is quieter beside a
  # keyboard.
  #
  # Two values, so it is walked in place: a submenu of two rows was never a
  # place, and comparing two looks meant opening the menu twice. What it costs
  # is the line each row carried saying how the two differ - a tile that shows
  # one value has nowhere to put it - and with two values whose names say it,
  # that is a good trade. `Button labels` and `Profile` are cards for exactly
  # that reason: getting either wrong scrambles the face buttons, and the
  # sentence under each choice is what stops you.
  [[menu.items.items]]
  icon = "󰏘"
  label = "Button style"
  control = "choice"
  span = [3, 1]
  reads = "pad:badge_style"

  # How fast omapad's own surfaces move, and at 0 whether they move at all.
  # A slider rather than a switch because less is a real answer between the
  # two: a menu that slides half as far still says a tile went away, and a
  # screen that is hard to read while it is moving is not always one that has
  # to be still.
  #
  # These three are what omapad draws, not what the screen is set to, so
  # they are on the page of omapad's own settings beside `Button style`
  # rather than on Display next to the monitor's. They were there for a
  # while and read as three questions about the television. Their own band,
  # a third each: the page's last row, and a whole one.
  [[menu.items.items]]
  icon = "󰓅"
  label = "Motion"
  span = [4, 1]
  control = "slider"
  reads = "pad:motion"

  # And how hard a corner is rounded, against what the compositor rounds a
  # window by. It is here for the same reason `Motion` is: you find out by
  # looking at it, and what you are looking at while you move this is the page
  # the slider is on - the tiles round under the thumb. 100% is the desktop's
  # own answer and 0 is square; the stops are a sqrt(2) ladder, so six presses
  # cross the whole range and every one of them is a corner you can tell from
  # the last.
  [[menu.items.items]]
  icon = "󰄴"
  label = "Corners"
  span = [4, 1]
  control = "slider"
  reads = "pad:radius"

  # And how solid a tile's ground is drawn, which is here for the reason the
  # two above it are: you find out by looking, and what you are looking at
  # while you move this is the page the slider is on - the tiles open up under
  # the thumb and the desktop comes through them. At 0 a plain tile has no
  # ground at all; the tile you are on stays solid whatever it says, so the
  # slider is also how far the page falls back behind the selection.
  [[menu.items.items]]
  icon = "󱡔"
  label = "Tile fill"
  span = [4, 1]
  control = "slider"
  reads = "pad:tile_fill"

# The readings, and the page the HUD draws (see [hud] and [sysinfo] above).
#
# An ordinary group, which is the whole design: the tiles are written here
# like every other tile, arranged with the gesture that arranges every other
# page, and where one sits in this grid is where it sits on the screen. `id`
# is pinned rather than taken from the label, because [hud] names the page and
# a label is allowed to change without the HUD going dark.
#
# The switch is on the page for the same reason it is not on the HUD: the HUD
# is never pressed, so the thing that turns it off has to be somewhere that
# is - and the page you turn it on from is the page you are already reading.
[[menu.items]]
id = "hud"
icon = "󰾅"
label = "Readings"
detail = "How busy, how full, how hot"

  [[menu.items.items]]
  icon = "󰘚"
  label = "Processor"
  control = "readout"
  reads = "sys:cpu"

  [[menu.items.items]]
  icon = "󰍛"
  label = "Memory"
  control = "readout"
  reads = "sys:memory"

  [[menu.items.items]]
  icon = "󰋊"
  label = "Disk"
  control = "readout"
  reads = "sys:disk"

  # The time, with hands on it. Not a reading - nothing publishes it and
  # nothing could fail to - and it is on this page because this is the page
  # that is left on screen: game mode takes Omarchy's bar away, and the bar is
  # where the time was.
  #
  # No icon. A control tile's picture is the control, and a clock face with a
  # clock glyph beside it is the tile saying the same thing twice.
  [[menu.items.items]]
  label = "Time"
  control = "clock"

  # The four that are not here, and how to add one. Each needs a source in
  # [sysinfo] first - a tile pointed at a reading this machine publishes
  # nothing for is dropped rather than drawn empty, so adding the tile without
  # the source changes nothing on either screen.
  #
  #   [[menu.items.items]]
  #   icon = "󰔏"
  #   label = "Temperature"
  #   control = "readout"
  #   reads = "sys:temperature"
  #
  # And the same shape for `sys:fan` (󰈐 Fan), `sys:gpu` (󰢮
  # Graphics) and `sys:fps` (󰕧 Frames).

  [[menu.items.items]]
  control = "row_break"

  [[menu.items.items]]
  icon = "󰍹"
  label = "Keep on screen"
  detail = "Stays up over a game"
  span = [3, 1]
  control = "toggle"
  reads = "pad:hud"

[[menu.items]]
icon = ""
label = "System"
meta = { from = "checkupdates 2>/dev/null | wc -l | awk '{print ($1 > 0) ? $1 \" waiting\" : \"\"}'", ttl = 900, empty = "Up to date" }

  # Which mode the machine comes back in, set from the pad because that is the
  # only way to set it on a machine nobody walks to a keyboard for. It is here
  # rather than under Controller - it decides nothing about the pad - and it is
  # first, above the rows that are the way to find out whether it took.
  #
  # The one setting row in the tree that changes nothing when it lands: it is
  # about the next start, not this one. So neither row says "on" - both say
  # what a start would do, and the tick says which one is waiting.
  #
  # **A card of rows rather than a chevron.** It was a `choice`, walked in
  # place, and a choice shows one value - so the sentence saying how the two
  # differ had nowhere to go, and a card reading `Game mode` was a card you
  # had to press to find out what else there was. Both values are on screen
  # now, each with its own line, and the tick says which one the next start is
  # waiting on. It is the shape a tick submenu always wanted and could not
  # have while a page cost a level.
  [[menu.items.items]]
  label = "Start in"
  detail = "The mode at the next start"
  control = "rows"
  # Three wide rather than the default two: a row with a line under it is a
  # row that has to hold a sentence, and forty characters do not fit in two
  # cells beside a tick. And three tall, which is the `Power` card beside it:
  # two cards of one page standing at two heights is a step in a band that
  # holds nothing.
  span = [3, 3]

    [[menu.items.items.items]]
    label = "Game mode"
    detail = "A bigger bar; nothing else changes"
    action = "pad:start_mode=game"
    stay = true

    [[menu.items.items.items]]
    label = "Desktop"
    detail = "Omarchy's own bar, at its own size"
    action = "pad:start_mode=desktop"
    stay = true

  # **One card of power, and the last three count rather than being held.**
  # Five verbs at a cell each was five squares saying one word, which is the
  # scatter a card exists to end - and `Omarchy menu` below stays a tile,
  # because it is a door out of this menu rather than a thing the machine
  # does.
  #
  # Lock and Suspend are a plain press: both are one button away from where
  # you were. Logout, Reboot and Shutdown are not - whatever was unsaved is
  # gone - and they were an announced **hold**, which is the right gesture
  # where it is already in the hand and over in a second. It is the wrong
  # one here. What these three do is take the screen away, and being sure
  # about that is not something to do with a thumb: it is something to be
  # given long enough to change your mind about. So A starts `[menu]
  # countdown` seconds, the row prints them, and B stops it.
  [[menu.items.items]]
  label = "Power"
  control = "rows"
  span = [3, 3]
  # A glyph per row said nothing here: five words that are each the whole of
  # what the row does, with a small mark in front of each one repeating it.
  # `pad-wording`'s rule about a detail that restates its label, one field
  # along. `Windows` spent four on the same repetition for a while; no card
  # of rows carries a mark now.
  detail = "The last three count down first"

    [[menu.items.items.items]]
    label = "Lock"
    action = "exec:omarchy-system-lock"

    [[menu.items.items.items]]
    label = "Suspend"
    action = "exec:systemctl suspend"

    [[menu.items.items.items]]
    label = "Logout"
    action = "exec:omarchy-system-logout"
    countdown = true

    [[menu.items.items.items]]
    label = "Reboot"
    action = "exec:omarchy-system-reboot"
    countdown = true

    [[menu.items.items.items]]
    label = "Shutdown"
    action = "exec:omarchy-system-shutdown"
    countdown = true

  # **The things this machine can do that nobody wrote down here.** A card of
  # rows like `Power`, except that what is in it is a folder: every
  # executable file in `~/.config/omapad/scripts` is a row, read when this
  # page settles, so adding one is dropping a file in a folder rather than
  # editing this file. It is the answer to "I want the pad to do this one
  # thing" that does not cost a binding, a setting or a line in the shipped
  # tree.
  #
  # `%1` is the path, quoted as it goes in - a script whose name has a space
  # in it stays one argument. The label is the file's name without its
  # extension, because `.sh` is not something anybody is choosing between,
  # and only files that are executable are listed: a row that cannot run is
  # worse from a sofa than no row at all.
  [[menu.items.items]]
  label = "Scripts"
  control = "rows"
  span = [3, 3]
  detail = "~/.config/omapad/scripts"
  empty = "Nothing there yet"
  action = "exec:%1"
  from = """
    for file in "$HOME"/.config/omapad/scripts/*; do
      [ -f "$file" ] && [ -x "$file" ] || continue
      name=${file##*/}
      printf '%s\t%s\n' "${name%.*}" "$file"
    done
  """

  # **The count on the bar, and the thing that answers it.** The nav card has
  # said `12 waiting` under `System` since a chip learned to say what a place
  # is doing, and a count on its own is a notice: it brings somebody to this
  # page and leaves them looking for the row that takes it. This is that row,
  # and it asks the **same** question on the same clock - a tile that
  # disagreed with the card that sent you here would be the surface arguing
  # with itself.
  #
  # `checkupdates` prints a line per package and nothing at all when there is
  # nothing, so the up-to-date case is the `empty` word and costs no
  # arithmetic. A quarter of an hour of freshness, because it copies the
  # package database and asks a mirror: that is not a question to re-ask
  # every time somebody walks across this page.
  #
  # **The guard is in the terminal it opens, not here.** `omarchy-update` says
  # what it is about to do and asks before it starts, so a `confirm` on the
  # tile would be the same question twice, the second one from a page that is
  # about to close. The wrapper is Omarchy's own, the window its own menu and
  # its own bar open this in.
  #
  # **And no written `detail` at all.** A `meta` stands where the written line
  # stands and falls back to its own `empty` word, so a tile with both has one
  # line that can never be drawn. `Up to date` is what it says while the
  # command is still counting, which is what the card on the bar has always
  # said in the same seconds.
  [[menu.items.items]]
  icon = "󰚰"
  label = "Update"
  # Two rows of the last column, with the door under it. It was three - a
  # card's full height, because a shorter tile left a strip that nothing
  # after a row break could reach - and dropping the break is what gives the
  # strip to `Omarchy menu`. The page is three rows and every cell of them
  # is spent.
  span = [3, 2]
  meta = { from = "checkupdates 2>/dev/null | wc -l | awk '{print ($1 > 0) ? $1 \" waiting\" : \"\"}'", ttl = 900, empty = "Up to date" }
  action = "exec:omarchy-launch-floating-terminal-with-presentation omarchy-update"

  # **Reboot and Shutdown were a cell each as well, and are not any more.**
  # They were rows in the card above *and* tiles beside it, on item 48's
  # argument about a row you have to go and find, spent on the two rows
  # anybody actually walks to this page for. What that bought was one press;
  # what it cost was a page that says the same two words twice, a cell away
  # from the card that says them - and a copy that has to be kept in step,
  # since a press guarded in one place and cheap in the other is worse than
  # not guarding it at all. The card is the page's answer to power: A goes
  # in, and all five are in front of you.
  #
  # If you put either back, give each copy its own `id`: the flash, the
  # countdown and the fill all name a tile by id, and two things answering to
  # one name is two things lighting up for one press.

  # Last on this page, and the way out of this menu into the one that has
  # everything else. It wants a keyboard, which is why it is not the menu the
  # pad opens - and it is here rather than a chip of its own because the bar
  # holds places you go to, and this is a door you leave by.
  [[menu.items.items]]
  # A hamburger rather than Omarchy's own mark. The mark was the better
  # label - the thing on the other side of a door is what a door should be
  # labelled with - and it is at U+E900 in `omarchy.ttf`, a private-use
  # codepoint that did not survive being written into this file: what shipped
  # was an empty string, so the row drew no mark at all. `icon_font` is still
  # how a row names the family its glyph came from, for whoever puts it back
  # with the character intact.
  icon = "󰍜"
  label = "Omarchy menu"
  detail = "Everything else"
  # Three cells, in the corner the `Update` tile leaves: `Omarchy m…` is
  # what one cell had room for, and the foot of the last column is the last
  # thing read on the page - which is where a door belongs. It stood on a
  # row of its own with nine empty cells beside it while a break kept it
  # there.
  span = [3, 1]
  action = "exec:omarchy-menu toggle"

# ---------------------------------------------------------------------------
# Per-application profiles (item 09) - optional.
#
# A profile matches the focused window's class (case-insensitive substring; a
# list matches any of them) and swaps the buttons it names over the shipped
# map. Buttons a profile does not name keep working as before. A profile never
# reaches the keyboard, menu or guide surfaces - what is drawn on screen
# outranks the app underneath. `omapad check` flags a binding that does not
# parse. Uncomment and edit to use.
#
# [profile.shell]
# match = ["alacritty", "foot", "wezterm"]     # a list matches any of them
# [profile.shell.bindings]
# Y = "key:SUPER+L"        # lock the terminal - some terminals ignore this key
# B = "exec:omarchy-menu toggle"

# [profile.browser]
# match = "chromium"        # a bare string is a single match
# [profile.browser.bindings]
# ZR = "exec:omarchy-capture-screenshot"

  # What is paired, and which of it is connected. A pad that has slept, or
  # headphones that paired with a phone in the meantime, come back from here
  # rather than from a keyboard: a press connects the one it is on, turning
  # the radio on first where it is off.
  #
  # Listed, because a config file cannot know what was paired. `*` is
  # connected, and more than one can be - the pad and a headset at once -
  # which is a thing a listing's tick was not made for: a press moves it onto
  # the row pressed until the page is next entered and read again. No
  # disconnect row: a device is let go by switching it off, and the pad is
  # usually the thing holding the menu.
  #
  # Six wide, so a device's own long name fits; three tall beside the switch
  # and the way to pair something new, so the band is whole.
  [[menu.items.items]]
  label = "Paired devices"
  control = "rows"
  span = [6, 3]
  empty = "Nothing paired yet"
  action = "exec:omarchy-bluetooth-device connect %1"
  from = '''
    on=$(timeout 1 bluetoothctl devices Connected 2>/dev/null)
    timeout 1 bluetoothctl devices Paired 2>/dev/null |
      while read -r _ address name; do
        mark=""
        case "$on" in *"$address"*) mark="* " ;; esac
        printf '%s%s\t%s\n' "$mark" "${name:-$address}" "$address"
      done
  '''

  # The radio itself. Through Omarchy's helper rather than bluetoothctl,
  # because off there is an rfkill block and that is what survives a reboot.
  [[menu.items.items]]
  label = "Bluetooth"
  span = [6, 1]
  control = "toggle"
  reads = "live:bluetooth"

  # Pairing needs a search that takes longer than a listing may, and a list
  # that fills while you watch it, so it is Omarchy's own panel rather than a
  # second one here. That panel hangs off Omarchy's bar, which game mode
  # takes away; where it cannot open, a notification says why instead of the
  # press doing nothing.
  [[menu.items.items]]
  icon = "󰂯"
  label = "Pair a device"
  detail = "In Omarchy's Bluetooth panel"
  span = [4, 2]
  action = '''exec:
    [ "$(omarchy-shell shell summon omarchy.bluetooth '{}' 2>/dev/null)" = ok ] ||
      omarchy-notification-send -g 󰂯 "Bluetooth panel unavailable" "It opens from Omarchy's bar, in desktop mode"
  '''

  # A watch with a stopwatch in it. It tells the time because game mode takes
  # Omarchy's bar away and the pad can reach no other clock; what it adds is
  # the one thing a clock cannot do, which is measure - a turn on the sofa, a
  # pot on the stove, how long that install has been going. It is on System
  # because it belongs to no errand of its own, and System is the page of
  # the machine rather than of any one thing on it.
  #
  # **One pusher, and A is it**: start, stop, reset, round again. B leaves this
  # surface and X closes it in every layer, so the second pusher a wrist-worn
  # chronograph has would have to come out of the face-button contract; a
  # monopusher is what a chronograph was before it had two, and the legend
  # under the card says which of the three the next press is. What it costs is
  # resuming, which the monopusher on a wrist cannot do either.
  #
  # No icon, and no `reads`: the control is the picture, and what it holds is
  # a press somebody made rather than anything a table could be pointed at.
  [[menu.items.items]]
  label = "Stopwatch"
  control = "chrono"

  # Whether the machine is online, and through what: the first thing to ask
  # when a stream will not start. Read-only where it stands - the line is
  # Omarchy's own answer - and a press opens Omarchy's network panel, where
  # a Wi-Fi network is picked. Choosing one wants a password, which is a
  # keyboard, so this page does not try to be that list.
  #
  # On a row of its own after the stopwatch: the band above is full, and two
  # rows tall because a one-row tile draws no line under its name, and the
  # line is the whole of what this tile says.
  [[menu.items.items]]
  icon = "󰖩"
  label = "Network"
  span = [6, 2]
  meta = { from = '''omarchy-network-status | awk -F'\t' 'NR == 1 { if ($1 == "wifi") print "Wi-Fi · " $2 (($3 != "") ? " · " $3 "%" : ""); else if ($1 == "ethernet") print "Wired"; else print "Not connected" }'''', ttl = 10, empty = "Checking" }
  action = '''exec:
    [ "$(omarchy-shell shell summon omarchy.network '{}' 2>/dev/null)" = ok ] ||
      omarchy-notification-send -g 󰖩 "Network panel unavailable" "It opens from Omarchy's bar, in desktop mode"
  '''
