# A tag becomes a release that names its commit.
#
# The install is two lines around a 40-character SHA (README, "Installation"),
# and boot.sh refuses to carry a default one, so the release page is the only
# place a stranger finds it. Writing that page by hand is where a SHA gets
# copied short, or from the wrong commit; here it is read off the tag.
#
# Push a tag named for the version both manifest.json and omapad.__version__
# carry - `git tag v2.0.0 && git push origin v2.0.0` - and nothing else.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

# One release at a time, and never one cut short halfway through publishing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    permissions:
      contents: read
    # `$/` (GitHub's self-repository form) is the stricter spelling, but
    # actionlint does not read it yet and a tag push is the only thing that
    # would show GitHub does; a release that fails to parse is worse. Nothing
    # runs before this line to put another ci.yml on disk.
    uses: ./.github/workflows/ci.yml  # zizmor: ignore[self-repository]

  release:
    name: Publish
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # An environment, so the repository settings can require an approval or
    # limit which tags may publish, without touching this file.
    environment: release
    permissions:
      contents: write  # gh release create
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every branch too, so origin/main is here to be asked about below.
          fetch-depth: 0
          persist-credentials: false

      - name: The tag, the manifest and the package agree
        run: |
          tag="${GITHUB_REF_NAME}"
          manifest="v$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')"
          package="v$(python3 -c 'import omapad; print(omapad.__version__)')"
          if [ "$tag" != "$manifest" ] || [ "$tag" != "$package" ]; then
            echo "::error::tag $tag, manifest.json $manifest, omapad.__version__ $package"
            exit 1
          fi

      - name: The commit is on main
        # A release names a reviewed commit, and the reviewed commits are the
        # ones main carries - not a tag pushed from a local branch.
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main"
            exit 1
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          cat > notes.md <<NOTES
          ## Install

          \`\`\`bash
          export OMAPAD_SHA=$sha
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/\$OMAPAD_SHA/boot.sh" | bash
          \`\`\`

          Commit: \`$sha\`
          NOTES
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes
